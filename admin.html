            <div class="row-actions" style="justify-content:flex-start"><a class="btn btn-ok" id="amwa" target="_blank" rel="noopener" href="https://wa.me/${waNum(phone)}?text=${encodeURIComponent(msg)}">Kirim lewat WhatsApp</a>
            <button class="btn btn-ghost" id="amcopy">Salin pesan</button><button class="btn btn-ghost" id="amlist">Lihat daftar admin</button></div></div>`;
          $("amcopy").onclick = async () => { try { await navigator.clipboard.writeText(msg); toast("Pesan disalin"); } catch (e) { prompt("Salin:", msg); } };

  function deleteAccount(c) {
    const who = c.full_name || c.phone || realEmail(c.email) || "akun ini";
    openModal(`<div class="modal-head"><h2>Hapus akun</h2><button class="x" data-close aria-label="Tutup">×</button></div>
      <p style="margin:0">Hapus akun <b>${esc(who)}</b>${c.phone ? ` (${esc(c.phone)})` : ""}? Orang ini tidak bisa masuk lagi, dan profilnya (nama, alamat) dihapus.</p>
      <p class="muted" style="margin:0">${c.orders_count ? `${c.orders_count} pesanannya tetap tersimpan di tab Pesanan, tapi tidak lagi terhubung ke akun.` : "Akun ini belum punya pesanan."} Tidak bisa dibatalkan. Nomor/email yang sama bisa mendaftar lagi nanti.</p>
      <label class="f">Ketik <b>HAPUS</b> untuk konfirmasi<input id="delc" autocomplete="off"></label>

        $("delgo").disabled = false; return;
      }
      closeModal(); toast("Akun dihapus"); loadCustomers();

  function resetPassword(c) {
    const words = "kopi,latte,aren,cireng,keju,mocha,matcha,gula,susu,botol".split(",");
    const pick = () => words[crypto.getRandomValues(new Uint32Array(1))[0] % words.length];
    const temp = `${pick()}-${pick()}-${String(crypto.getRandomValues(new Uint32Array(1))[0] % 9000 + 1000)}`;
    const wa = (c.phone || "").replace(/\D/g, "").replace(/^0/, "62");
    openModal(`<div class="modal-head"><h2>Reset password</h2><button class="x" data-close aria-label="Tutup">×</button></div>
      <p style="margin:0">Buat password baru untuk <b>${esc(c.full_name || c.phone || c.email)}</b>. Password lama langsung tidak berlaku.</p>
      <label class="f">Password baru (minimal 8 karakter)<input id="rp1" value="${esc(temp)}" autocomplete="off"></label>
      <p class="msg" id="rpm"></p>
      <div class="row-actions"><button class="btn btn-ghost" data-close>Batal</button><button class="btn btn-rose" id="rpsave">Simpan password baru</button></div>`);
    $("rpsave").onclick = async () => {
      const pw = $("rp1").value.trim();
      if (pw.length < 8) { $("rpm").textContent = "Minimal 8 karakter."; $("rpm").className = "msg err"; return; }
      $("rpsave").disabled = true;
      const out = await adminUsers({ action: "reset_password", user_id: c.id, password: pw });
      $("rpsave").disabled = false;
      if (out.error) { $("rpm").textContent = out.error === "NOT_ADMIN" ? "Hanya admin yang bisa reset password." : "Gagal menyimpan. Coba lagi."; $("rpm").className = "msg err"; return; }
      const msg = `Halo ${c.full_name || ""}, password akun CamilaNika kamu sudah kami ganti. Password baru: ${pw}\nMasuk di camilanika.github.io pakai nomor WhatsApp ini, lalu ganti password lewat menu Akun kalau mau.`;
      $("modal-box").innerHTML = `<div class="modal-head"><h2>Password diganti</h2><button class="x" data-close aria-label="Tutup">×</button></div>
        <p style="margin:0">Password baru: <code style="font-size:1.05rem;user-select:all">${esc(pw)}</code></p>
        <div class="row-actions">${wa ? `<a class="btn btn-ok" href="https://wa.me/${wa}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Kirim lewat WhatsApp</a>` : ""}<button class="btn btn-ghost" data-close>Selesai</button></div>`;
    };
  }

  // ---------------------------------------------------------------- REFERRAL & VOUCHER
  const VSTATE = { available: "Tersedia", pending: "Menunggu bayar pertama", reserved: "Dipesan (belum dibayar)", used: "Terpakai", expired: "Kedaluwarsa", revoked: "Dicabut" };
  const VEVENT = { created: "Dibuat", assigned: "Diberikan ke pelanggan", reserved: "Dipakai di pesanan (menunggu bayar)", released: "Dilepas (pesanan tidak dibayar)", used: "Terpakai (pembayaran berhasil)", revoked: "Dicabut", activated: "Aktif (pembayaran pertama)" };
  const VERR = {
    CODE_TAKEN: "Kode sudah dipakai (promo, voucher, atau referral lain).", VOUCHER_ALREADY_ASSIGNED: "Voucher sudah dimiliki pelanggan lain.",
    VOUCHER_NOT_AVAILABLE: "Voucher tidak bisa diberikan (sudah terpakai, dicabut, atau kedaluwarsa).", VOUCHER_ALREADY_USED: "Voucher sudah terpakai, tidak bisa dicabut.",
    VOUCHER_IN_USE: "Voucher sedang dipakai di pesanan yang belum dibayar. Tunggu sampai pesanan dibayar atau batal.", CUSTOMER_NOT_FOUND: "Pelanggan tidak ditemukan.",
    VOUCHER_NOT_FOUND: "Voucher tidak ditemukan.", NOT_ADMIN: "Hanya admin.",
  };
  const verr = (e) => { const m = (e?.message || String(e)); const k = Object.keys(VERR).find((x) => m.includes(x)); return k ? VERR[k] : /duplicate key/i.test(m) ? VERR.CODE_TAKEN : /check constraint/i.test(m) ? "Isian belum valid (cek nilai diskon dan format kode: huruf/angka/tanda -)." : m; };
  const offer = (x) => (x.discount_type === "percent" ? `${x.value}%${x.max_discount ? " (maks " + rp(x.max_discount) + ")" : ""}` : x.discount_type === "shipping" ? `Ongkir s/d ${rp(x.value)}` : rp(x.value)) + (x.min_spend ? ` · min ${rp(x.min_spend)}` : "");
  const randCode = (n = 8) => { const a = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let c = ""; for (let i = 0; i < n; i++) c += a[Math.floor(Math.random() * a.length)]; return c; };
  const copy = async (t, what) => { try { await navigator.clipboard.writeText(t); toast(`${what} disalin`); } catch (e) { prompt("Salin:", t); } };
  const regLink = (code) => `${(CFG.SITE_URL || "https://camilanika.github.io/").replace(/\/?$/, "/")}?ref=${encodeURIComponent(code)}`;
  const toLocal = (d) => d ? new Date(new Date(d).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : "";
  let vSub = "campaigns", allProducts = null;
  async function productList() { if (!allProducts) { const { data } = await sb.from("products").select("id,name").order("sort_order").order("id"); allProducts = data || []; } return allProducts; }
  const productPicker = async (id, all, sel) => `
    <label class="chk"><input type="checkbox" id="${id}-all" ${all ? "checked" : ""}> Berlaku untuk semua produk</label>
    <div class="pchk" id="${id}-list" ${all ? "hidden" : ""}>${(await productList()).map((x) => `<label class="chk"><input type="checkbox" value="${x.id}" ${sel.has(x.id) ? "checked" : ""}> ${esc(x.name)}</label>`).join("")}</div>`;
  const wirePicker = (id) => { $(id + "-all").onchange = () => { $(id + "-list").hidden = $(id + "-all").checked; }; };
  const picked = (id) => [...$(id + "-list").querySelectorAll("input:checked")].map((i) => +i.value);

  async function renderVouchersTab() {
    app.innerHTML = `<div class="bar"><h2 id="vtitle"></h2></div><div id="vbody"></div>`;
    drawSub();
  }
  function drawSub() {
    document.querySelectorAll("#subnav-vouchers [data-vs]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.vs === vSub)));
    $("vtitle").textContent = SUB_NAME[vSub];
    syncPlace();

  }

  // ----- campaigns
  const campState = (c, st) => {
    if (c.status === "ended" || (c.ends_at && new Date(c.ends_at) <= new Date())) return ["ended", "Berakhir"];
    if (c.status === "paused") return ["paused", "Dijeda"];
    if (c.starts_at && new Date(c.starts_at) > new Date()) return ["notyet", "Belum mulai"];
    if (c.max_rewards && (st?.issued || 0) >= c.max_rewards) return ["full", "Kuota habis"];
    return ["active", "Aktif"];
  };
  async function renderCampaigns() {
    const el = $("vbody");
    el.innerHTML = `<div class="bar" style="margin-bottom:.6rem"><p class="muted" style="margin:0;flex:1;min-width:240px">Kode referral dibagikan lewat WhatsApp / Instagram. Pelanggan baru yang daftar dengan kode aktif dapat <b>voucher sekali pakai</b> dengan kode unik miliknya sendiri.</p>
      <button class="btn btn-rose" id="newcamp">+ Kampanye baru</button></div>
      <div class="tbl-wrap"><table><thead><tr><th>Kampanye</th><th>Kode & link</th><th>Hadiah</th><th>Periode</th><th class="num">Daftar</th><th class="num">Voucher</th><th class="num">Dipakai</th><th>Status</th><th></th></tr></thead>
      <tbody id="cbody2"><tr><td colspan="9" class="muted">Memuat…</td></tr></tbody></table></div>`;
    $("newcamp").onclick = () => editCampaign(null);
    const [{ data, error }, { data: stats }] = await Promise.all([
      sb.from("referral_campaigns").select("*, referral_campaign_products(product_id)").order("created_at", { ascending: false }),
      sb.rpc("admin_campaign_stats")]);
    const tb = $("cbody2"); if (!tb) return;
    if (error) { tb.innerHTML = `<tr><td colspan="9" class="msg err">${esc(err(error))}</td></tr>`; return; }
    if (!data.length) { tb.innerHTML = `<tr><td colspan="9" class="muted">Belum ada kampanye. Buat satu, lalu bagikan kodenya.</td></tr>`; return; }
    tb.innerHTML = data.map((c) => {
      const st = (stats || {})[c.id] || {}, [k, label] = campState(c, st);
      return `<tr data-c="${c.id}"><td><b>${esc(c.name)}</b><br><span class="muted" style="font-size:.8rem">${c.reward_on === "first_payment" ? "Voucher aktif setelah bayar pertama" : "Voucher langsung aktif"} · berlaku ${c.valid_days} hari</span></td>
        <td><div class="codecell"><code>${esc(c.code)}</code><button class="btn btn-ghost btn-sm" data-cc="${esc(c.code)}">Salin kode</button><button class="btn btn-ghost btn-sm" data-cl="${esc(c.code)}">Salin link</button></div></td>
        <td>${esc(offer(c))}${c.applies_to_all ? "" : `<br><span class="muted" style="font-size:.8rem">${c.referral_campaign_products.length} produk</span>`}</td>
        <td style="font-size:.85rem">${c.starts_at ? fmtDate(c.starts_at) : "Sekarang"} – ${c.ends_at ? fmtDate(c.ends_at) : "tanpa batas"}</td>
        <td class="num">${st.registrations || 0}</td><td class="num">${st.issued || 0}${c.max_rewards ? " / " + c.max_rewards : ""}</td><td class="num">${st.redeemed || 0}</td>
        <td><span class="badge ${k}">${label}</span></td>
        <td><div class="row-actions" style="justify-content:flex-start">
          <button class="btn btn-ghost btn-sm" data-ce="${c.id}">Ubah</button>
          ${c.status === "active" ? `<button class="btn btn-ghost btn-sm" data-cs="paused" data-id="${c.id}">Jeda</button>` : c.status === "paused" ? `<button class="btn btn-ok btn-sm" data-cs="active" data-id="${c.id}">Aktifkan</button>` : ""}
          ${c.status !== "ended" ? `<button class="btn btn-ghost btn-sm" data-cs="ended" data-id="${c.id}">Akhiri</button>` : ""}
          <button class="btn btn-ghost btn-sm" data-cr="${c.id}">Pendaftar</button></div></td></tr>`;
    }).join("");
    tb.querySelectorAll("[data-cc]").forEach((b) => b.onclick = () => copy(b.dataset.cc, "Kode"));
    tb.querySelectorAll("[data-cl]").forEach((b) => b.onclick = () => copy(regLink(b.dataset.cl), "Link pendaftaran"));

  function wireVoucherFields(px) {
    const sync = () => { const t = $(px + "t").value; $(px + "mw").hidden = t !== "percent"; $(px + "vw").firstChild.textContent = t === "percent" ? "Diskon (%)" : t === "shipping" ? "Potongan ongkir maks. (Rp)" : "Potongan (Rp)"; };
    $(px + "t").onchange = sync; sync(); wirePicker(px + "p");
  }
  function readVoucherFields(px) {
    const num = (id) => $(id).value === "" ? null : parseInt($(id).value, 10), t = $(px + "t").value;
    const v = { code: $(px + "c").value.trim().toUpperCase() || null, discount_type: t, value: num(px + "v"), min_spend: num(px + "min") || 0,
      max_discount: t === "percent" ? num(px + "m") : null, expires_at: $(px + "e").value ? new Date($(px + "e").value).toISOString() : null,
      applies_to_all: $(px + "p-all").checked, product_ids: picked(px + "p") };
    if (v.code && !/^[A-Z0-9-]{4,24}$/.test(v.code)) return [null, "Kode 4–24 karakter: huruf, angka, atau tanda -."];
    if (t === "percent" && !(v.value >= 1 && v.value <= 100)) return [null, "Diskon persen harus 1–100."];
    if ((t === "fixed" || t === "shipping") && !(v.value > 0)) return [null, "Isi nilai potongan."];
    if (v.expires_at && new Date(v.expires_at) <= new Date()) return [null, "Tanggal berlaku harus di masa depan."];

    openModal(`<div class="modal-head"><h2>Assign voucher</h2><button class="x" data-close aria-label="Tutup">×</button></div>

      if (!$("asq")) return;

      el.innerHTML = data.length ? data.map((c) => `<label><input type="radio" name="asc" value="${c.id}"> <span><b>${esc(c.full_name || "–")}</b> · ${esc(c.phone || c.email || "")}<br><span class="muted" style="font-size:.75rem">${esc(c.id)}</span></span></label>`).join("")

      const { data } = await sb.rpc("admin_list_vouchers", { p_search: null, p_state: "available", p_source: "admin" });

    }
    $("assave").onclick = async () => {
      const fail = (m) => { $("asmsg").textContent = m; $("asmsg").className = "msg err"; };
      if (!chosen) return fail("Pilih pelanggan dulu.");
      const note = $("asnote").value.trim() || null;

        const vid = pre ? pre.id : +$("asv").value;
        if (!vid) { $("assave").disabled = false; return fail("Pilih voucher, atau buat yang baru."); }
        res = await sb.rpc("admin_assign_voucher", { p_voucher_id: vid, p_user: chosen, p_note: note });
      } else {
        const [v, bad] = readVoucherFields("an");
        if (bad) { $("assave").disabled = false; return fail(bad); }

  function editTier(t) {
    const isNew = !t;
    t = t || { name: "", threshold: 100000, discount_type: "fixed", value: 10000, min_spend: 0, valid_days: 30, recurring: false, is_active: true };
    openModal(`<div class="modal-head"><h2>${isNew ? "Milestone baru" : "Ubah milestone"}</h2><button class="x" data-close aria-label="Tutup">×</button></div>
      <div class="grid2">
        <label class="f">Nama<input id="tn" value="${esc(t.name)}" placeholder="mis. Pelanggan Setia"></label>
        <label class="f">Total belanja minimal (Rp)<input id="tth" type="number" min="1000" step="1000" value="${t.threshold}"></label>
      </div>
      <label class="chk"><input type="checkbox" id="trec" ${t.recurring ? "checked" : ""}> Berulang: hadiah lagi setiap kelipatan jumlah ini</label>
      <div class="grid3">
        <label class="f">Jenis voucher<select id="tt"><option value="fixed">Potongan Rupiah</option><option value="percent">Diskon persen</option><option value="shipping">Potongan ongkir saja</option></select></label>
        <label class="f" id="tvw">Nilai<input id="tv" type="number" min="1" value="${t.value}"></label>
        <label class="f" id="tmw">Maks. diskon (opsional)<input id="tm" type="number" min="1" value="${t.max_discount ?? ""}"></label>
        <label class="f">Minimal belanja pakai voucher (Rp)<input id="tmin" type="number" min="0" step="1000" value="${t.min_spend}"></label>
        <label class="f">Voucher berlaku (hari)<input id="tvd" type="number" min="1" max="3650" value="${t.valid_days}"></label>
        <label class="f">Paling lambat (opsional)<input id="tvu" type="datetime-local" value="${toLocal(t.valid_until)}"></label>
      </div>
      <label class="f">Keterangan untuk pelanggan (opsional)<input id="tdesc" value="${esc(t.description || "")}" placeholder="mis. Terima kasih sudah langganan!"></label>
      <label class="chk"><input type="checkbox" id="tact" ${t.is_active ? "checked" : ""}> Aktif</label>
      <p class="muted" style="margin:0;font-size:.85rem">Perubahan berlaku untuk pembayaran berikutnya. Pelanggan yang totalnya <b>sudah</b> melewati milestone baru/yang diturunkan tidak otomatis dapat; pakai tombol <b>Berikan ke … pelanggan</b> kalau memang ingin memberi. Voucher yang sudah diberikan tidak berubah.</p>
      <p class="msg" id="tmsg"></p>
      <div class="row-actions">${isNew ? "" : '<button class="btn btn-ghost" id="tdel" style="margin-right:auto">Hapus</button>'}<button class="btn btn-ghost" data-close>Batal</button><button class="btn btn-rose" id="tsave">Simpan</button></div>`);
    $("tt").value = t.discount_type;
    const sync = () => { const k = $("tt").value; $("tmw").hidden = k !== "percent"; $("tvw").firstChild.textContent = k === "percent" ? "Diskon (%)" : k === "shipping" ? "Potongan ongkir maks. (Rp)" : "Potongan (Rp)"; };
    $("tt").onchange = sync; sync();
    if (!isNew) $("tdel").onclick = async () => {
      if (!confirm("Hapus milestone ini? Voucher yang sudah diberikan tetap berlaku. Lebih aman dinonaktifkan saja.")) return;
      const { error } = await sb.from("loyalty_tiers").delete().eq("id", t.id);
      if (error) return toast(err(error));
      closeModal(); toast("Milestone dihapus"); loadTiers();
    };
    $("tsave").onclick = async () => {
      const num = (id) => $(id).value === "" ? null : parseInt($(id).value, 10), k = $("tt").value;
      const row = { name: $("tn").value.trim(), threshold: num("tth"), recurring: $("trec").checked, discount_type: k, value: num("tv"),
        max_discount: k === "percent" ? num("tm") : null, min_spend: num("tmin") || 0, valid_days: num("tvd") || 30,
        valid_until: $("tvu").value ? new Date($("tvu").value).toISOString() : null, description: $("tdesc").value.trim() || null, is_active: $("tact").checked };
      const fail = (m) => { $("tmsg").textContent = m; $("tmsg").className = "msg err"; };
      if (!row.name) return fail("Isi nama milestone.");
      if (!(row.threshold > 0)) return fail("Isi total belanja minimal.");
      if (k === "percent" && !(row.value >= 1 && row.value <= 100)) return fail("Diskon persen harus 1–100.");
      if ((k === "fixed" || k === "shipping") && !(row.value > 0)) return fail("Isi nilai potongan.");
      if (row.valid_until && new Date(row.valid_until) <= new Date()) return fail("Tanggal paling lambat harus di masa depan.");
      $("tsave").disabled = true;
      const { error } = isNew ? await sb.from("loyalty_tiers").insert(row) : await sb.from("loyalty_tiers").update(row).eq("id", t.id);
      if ($("tsave")) $("tsave").disabled = false;
      if (error) return fail("Gagal menyimpan: " + err(error));
      closeModal(); toast("Milestone tersimpan"); loadTiers(); loadLoyCustomers();
    };
  }

        <td><input data-km type="number" min="0" step="0.5" value="${t.up_to_km ?? ""}" style="width:110px" aria-label="Sampai km baris ${i + 1}"></td>
        <td><input data-fee type="number" min="0" step="500" value="${t.fee ?? ""}" style="width:130px" aria-label="Ongkir baris ${i + 1}"></td>
        <td><button class="btn btn-ghost btn-sm" data-rmt="${i}" aria-label="Hapus baris">✕</button></td></tr>`).join("") || `<tr><td colspan="3" class="muted">Belum ada tarif. Tambah baris, mis. sampai 5 km = Rp10.000.</td></tr>`;
      $("dl-tiers").querySelectorAll("[data-rmt]").forEach((b) => b.onclick = () => { readTiers(); tiers.splice(+b.dataset.rmt, 1); drawTiers(); });
    };
    drawTiers();
    $("dl-add").onclick = () => { readTiers(); const last = tiers.at(-1); tiers.push({ up_to_km: last ? (last.up_to_km || 0) + 5 : 5, fee: "" }); drawTiers(); };
    $("dl-save").onclick = async () => {
      readTiers();
      const clean = tiers.filter((t) => Number.isFinite(t.up_to_km) && Number.isFinite(t.fee)).sort((a, b) => a.up_to_km - b.up_to_km);
      const fail = (m) => { $("dl-m").textContent = m; $("dl-m").className = "msg err"; };
      if (clean.length !== tiers.length) return fail("Isi km dan ongkir di setiap baris (atau hapus barisnya).");
      const free = parseFloat($("dl-free").value) || 0, max = parseFloat($("dl-max").value) || 0;
      if ($("dl-on").checked && max <= free && !clean.length) return fail("Isi tarif, atau naikkan Maks jarak antar.");
      save({ delivery_fee_enabled: $("dl-on").checked, free_radius_km: free, max_radius_km: max, fee_tiers: clean, origin_lat: origin.lat, origin_lng: origin.lng }, "Pengaturan pengiriman tersimpan");
    };
    // map for the shop's location (OpenStreetMap, free)
    loadLeaflet().then(() => {
      if (!$("dl-map")) return;
      const m = L.map("dl-map").setView([origin.lat, origin.lng], 15);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(m);
      const pinO = L.marker([origin.lat, origin.lng], { draggable: true }).addTo(m);
      const set = (ll) => { origin = { lat: Math.round(ll.lat * 1e6) / 1e6, lng: Math.round(ll.lng * 1e6) / 1e6 }; showOrig(); };
      pinO.on("dragend", () => set(pinO.getLatLng()));
      m.on("click", (e) => { pinO.setLatLng(e.latlng); set(e.latlng); });
    }).catch(() => { $("dl-map").textContent = "Peta gagal dimuat."; });
  }
  let leafletP = null;
  function loadLeaflet() {
    if (window.L) return Promise.resolve();
    if (leafletP) return leafletP;
    leafletP = new Promise((res, rej) => {
      const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
      const js = document.createElement("script"); js.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; js.onload = res; js.onerror = () => { leafletP = null; rej(); };
      document.head.appendChild(js);
    });
    return leafletP;
  }

  // ---------------------------------------------------------------- PROMOS
  async function renderPromos() {
    app.innerHTML = `<div class="bar"><h2>Promo</h2><button class="btn btn-rose" id="newpr">+ Promo baru</button></div>
      <p class="muted" style="margin:-.4rem 0 1rem">Promo tanpa kode berlaku otomatis (diskon terbesar yang dipakai; semua hadiah gratis yang memenuhi syarat diberikan). Promo dengan kode harus diketik pembeli.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Nama</th><th>Kode</th><th>Jenis</th><th class="num">Min. belanja</th><th>Periode</th><th class="num">Dipakai</th><th>Status</th><th></th></tr></thead><tbody id="prbody"><tr><td colspan="8" class="muted">Memuat…</td></tr></tbody></table></div>`;
    $("newpr").onclick = () => editPromo(null);
    await loadPromos();
  }
  let promos = [];
  async function loadPromos() {
    const { data, error } = await sb.from("promotions").select("*, promotion_products(product_id)").order("created_at", { ascending: false });
    const tb = $("prbody"); if (!tb) return;
    if (error) { tb.innerHTML = `<tr><td colspan="8" class="msg err">${esc(err(error))}</td></tr>`; return; }
    promos = data;
    const now = Date.now();
    tb.innerHTML = data.map((p) => {
      const live = p.is_active && (!p.starts_at || new Date(p.starts_at) <= now) && (!p.ends_at || new Date(p.ends_at) > now) && (!p.usage_limit || p.used_count < p.usage_limit);
      const kind = p.discount_type === "percent" ? `${p.value}%${p.max_discount ? " (maks " + rp(p.max_discount) + ")" : ""}` : p.discount_type === "fixed" ? rp(p.value) : "🎁 " + esc(p.gift_text);
      const period = p.starts_at || p.ends_at ? `${p.starts_at ? fmtDate(p.starts_at) : "…"} – ${p.ends_at ? fmtDate(p.ends_at) : "…"}` : "Selalu";
      return `<tr><td><b>${esc(p.name)}</b>${p.applies_to_all ? "" : '<br><span class="muted" style="font-size:.8rem">produk tertentu</span>'}</td><td>${p.code ? `<code>${esc(p.code)}</code>` : '<span class="muted">otomatis</span>'}</td>
        <td>${kind}</td><td class="num">${p.min_spend ? rp(p.min_spend) : "–"}</td><td style="font-size:.85rem">${period}</td><td class="num">${p.used_count}${p.usage_limit ? " / " + p.usage_limit : ""}</td>
        <td><span class="badge ${live ? "on" : "off"}">${live ? "Berjalan" : p.is_active ? "Tidak berjalan" : "Nonaktif"}</span></td>
        <td><button class="btn btn-ghost btn-sm" data-edit="${p.id}">Ubah</button></td></tr>`;
    }).join("") || `<tr><td colspan="8" class="muted">Belum ada promo.</td></tr>`;
    tb.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => editPromo(promos.find((x) => x.id === +b.dataset.edit)));
  }

  async function editPromo(p) {
    const isNew = !p;
    p = p || { name: "", description: "", code: "", discount_type: "percent", value: 10, gift_text: "", min_spend: 0, max_discount: null, applies_to_all: true, starts_at: null, ends_at: null, usage_limit: null, is_active: true, promotion_products: [] };
    if (!products.length) { const { data } = await sb.from("products").select("id,name").order("sort_order"); products = data || []; }
    const sel = new Set(p.promotion_products.map((x) => x.product_id));
    const dt = (d) => d ? new Date(new Date(d).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : "";
    openModal(`<div class="modal-head"><h2>${isNew ? "Promo baru" : "Ubah promo"}</h2><button class="x" data-close aria-label="Tutup">×</button></div>
      <div class="grid2">
        <label class="f">Nama promo<input id="qn" value="${esc(p.name)}" placeholder="mis. Diskon Gajian"></label>
        <label class="f">Kode (kosongkan = otomatis)<input id="qc" value="${esc(p.code || "")}" placeholder="mis. GAJIAN10" style="text-transform:uppercase"></label>
      </div>
      <label class="f">Keterangan untuk pembeli (tampil di banner / keranjang)<textarea id="qd" rows="2">${esc(p.description || "")}</textarea></label>
      <div class="grid3">
        <label class="f">Jenis<select id="qt"><option value="percent">Diskon persen</option><option value="fixed">Potongan Rupiah</option><option value="free_item">Hadiah gratis</option></select></label>
        <label class="f" id="qvw">Nilai<input id="qv" type="number" min="0" value="${p.value}"></label>
        <label class="f" id="qmw">Maks. diskon (opsional)<input id="qm" type="number" min="0" value="${p.max_discount ?? ""}"></label>
        <label class="f" id="qgw">Hadiah<input id="qg" value="${esc(p.gift_text || "")}" placeholder="mis. Free latte 150 ml"></label>
        <label class="f">Minimal belanja (Rp)<input id="qmin" type="number" min="0" step="1000" value="${p.min_spend}"></label>
        <label class="f">Batas pemakaian (opsional)<input id="ql" type="number" min="1" value="${p.usage_limit ?? ""}"></label>
        <label class="f">Mulai (opsional)<input id="qs" type="datetime-local" value="${dt(p.starts_at)}"></label>
        <label class="f">Berakhir (opsional)<input id="qe" type="datetime-local" value="${dt(p.ends_at)}"></label>
        <label class="chk" style="align-self:end"><input type="checkbox" id="qa" ${p.is_active ? "checked" : ""}> Aktif</label>
      </div>
      <label class="chk"><input type="checkbox" id="qann" ${p.announce !== false ? "checked" : ""}> Umumkan ke semua pelanggan terdaftar (notifikasi${isNew ? "" : ", kalau belum pernah dikirim"})</label>
      <p class="muted" style="margin:-.3rem 0 0;font-size:.85rem">Notifikasi terkirim saat promo aktif & sudah mulai. Untuk kode khusus yang tidak boleh tersebar, hilangkan centangnya.</p>
      <label class="chk"><input type="checkbox" id="qall" ${p.applies_to_all ? "checked" : ""}> Berlaku untuk semua produk</label>
      <div class="pchk" id="qprods" ${p.applies_to_all ? "hidden" : ""}>${products.map((x) => `<label class="chk"><input type="checkbox" value="${x.id}" ${sel.has(x.id) ? "checked" : ""}> ${esc(x.name)}</label>`).join("")}</div>
      <p class="muted" style="margin:0;font-size:.85rem">Minimal belanja dihitung dari produk yang ikut promo.</p>
      <p class="msg" id="qmsg"></p>
      <div class="row-actions">${isNew ? "" : '<button class="btn btn-ghost" id="qdel" style="margin-right:auto">Hapus promo</button>'}<button class="btn btn-ghost" data-close>Batal</button><button class="btn btn-rose" id="qsave">Simpan promo</button></div>`);
    $("qt").value = p.discount_type;
    const sync = () => { const t = $("qt").value; $("qvw").hidden = t === "free_item"; $("qmw").hidden = t !== "percent"; $("qgw").hidden = t !== "free_item"; $("qvw").firstChild.textContent = t === "percent" ? "Diskon (%)" : "Potongan (Rp)"; };
    $("qt").onchange = sync; sync();
    $("qall").onchange = () => { $("qprods").hidden = $("qall").checked; };
    if (!isNew) $("qdel").onclick = async () => {
      if (p.used_count && !confirm("Promo ini sudah pernah dipakai. Lebih aman dinonaktifkan saja. Tetap hapus?")) return;
      if (!p.used_count && !confirm("Hapus promo ini?")) return;
      const { error } = await sb.from("promotions").delete().eq("id", p.id);
      if (error) return toast(/foreign key/i.test(error.message) ? "Promo sudah dipakai di pesanan — nonaktifkan saja." : err(error));
      closeModal(); toast("Promo dihapus"); loadPromos();
    };
    $("qsave").onclick = async () => {
      const t = $("qt").value, num = (id) => $(id).value === "" ? null : parseInt($(id).value, 10);
      const row = {
        name: $("qn").value.trim(), description: $("qd").value.trim() || null, code: $("qc").value.trim().toUpperCase() || null,
        discount_type: t, value: t === "free_item" ? 0 : num("qv") || 0, gift_text: t === "free_item" ? $("qg").value.trim() : null,
        max_discount: t === "percent" ? num("qm") : null, min_spend: num("qmin") || 0, usage_limit: num("ql"),
        starts_at: $("qs").value ? new Date($("qs").value).toISOString() : null, ends_at: $("qe").value ? new Date($("qe").value).toISOString() : null,
        is_active: $("qa").checked, applies_to_all: $("qall").checked, announce: $("qann").checked,
      };
      const fail = (m) => { $("qmsg").textContent = m; $("qmsg").className = "msg err"; };
      if (!row.name) return fail("Nama promo wajib diisi.");
      if (t === "percent" && !(row.value >= 1 && row.value <= 100)) return fail("Diskon persen harus 1–100.");
      if (t === "fixed" && !(row.value > 0)) return fail("Isi nilai potongan.");
      if (t === "free_item" && !row.gift_text) return fail("Isi nama hadiahnya.");
      if (row.starts_at && row.ends_at && row.ends_at <= row.starts_at) return fail("Tanggal berakhir harus setelah tanggal mulai.");
      const picked = [...$("qprods").querySelectorAll("input:checked")].map((i) => +i.value);
      if (!row.applies_to_all && !picked.length) return fail("Pilih minimal satu produk.");
      $("qsave").disabled = true;
      try {
        let id = p.id;
        if (isNew) { const { data, error } = await sb.from("promotions").insert(row).select("id").single(); if (error) throw error; id = data.id; }
        else { const { error } = await sb.from("promotions").update(row).eq("id", id); if (error) throw error; }
        { const { error } = await sb.from("promotion_products").delete().eq("promotion_id", id); if (error) throw error; }
        if (!row.applies_to_all) { const { error } = await sb.from("promotion_products").insert(picked.map((pid) => ({ promotion_id: id, product_id: pid }))); if (error) throw error; }
        closeModal(); toast("Promo tersimpan"); loadPromos();
      } catch (e) {
        fail(/duplicate key.*code/i.test(e.message) ? "Kode promo sudah dipakai." : "Gagal menyimpan: " + e.message);
      } finally { const b = $("qsave"); if (b) b.disabled = false; }
    };
  }
})();
</script>
</body>
</html>
