<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="img/logo-cireng.jpg">
<title>CamilaNika Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#FBF3EA;--paper:#FFFAF4;--fg:#4A2A1C;--muted:#7D5F52;--line:#EBD7C8;--rose:#D9586F;--rose-ink:#fff;--rose-soft:#FBE1E6;--caramel:#B9763A;--ok:#1F9D55;--ok-soft:#DDF3E6;--warn-soft:#F7E6D3;
  --f-display:"Baloo 2","Nunito",system-ui,sans-serif;--f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1411;--paper:#271C18;--fg:#F6E6DA;--muted:#C9AE9F;--line:#3E2E27;--rose:#EE7F95;--rose-ink:#2A0F16;--rose-soft:#3A2128;--caramel:#E0A266;--ok:#36C075;--ok-soft:#1E3427;--warn-soft:#3A2B1C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C1411;--paper:#271C18;--fg:#F6E6DA;--muted:#C9AE9F;--line:#3E2E27;--rose:#EE7F95;--rose-ink:#2A0F16;--rose-soft:#3A2128;--caramel:#E0A266;--ok:#36C075;--ok-soft:#1E3427;--warn-soft:#3A2B1C;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15}
a{color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:1rem;padding-block:.6rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.brand img{width:36px;height:36px;border-radius:50%}
.tabs{display:flex;gap:.3rem;flex-wrap:wrap}
.tabs button{font:800 .9rem var(--f-body);border:1.5px solid var(--line);background:transparent;color:var(--fg);padding:.45rem .9rem;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.top .me{margin-left:auto;display:flex;gap:.6rem;align-items:center;color:var(--muted);font-weight:700;font-size:.85rem}
main{padding-block:1.4rem 4rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font:800 .88rem/1 var(--f-body);padding:.6rem .95rem;border-radius:999px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:wait}
.btn-rose{background:var(--rose);color:var(--rose-ink)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn-ok{background:var(--ok);color:#fff}
.btn-sm{padding:.4rem .7rem;font-size:.8rem}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1rem}
.bar h2{font-size:1.6rem;margin-right:auto}
input,select,textarea{font:inherit;color:var(--fg);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:.5rem .65rem;min-width:0}
textarea{resize:vertical}
label.f{display:grid;gap:.2rem;font-size:.78rem;font-weight:800;color:var(--muted)}
label.f input,label.f select,label.f textarea{font-size:.95rem;font-weight:600}
.chk{display:flex;gap:.45rem;align-items:center;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1rem}
.list{display:grid;gap:.7rem}
.muted{color:var(--muted)}
.badge{display:inline-block;padding:.15rem .6rem;border-radius:999px;font-weight:800;font-size:.75rem;background:var(--line)}
.badge.paid,.badge.processing,.badge.on{background:var(--ok-soft);color:var(--ok)}
.badge.completed{background:var(--line);color:var(--fg)}
.badge.pending,.badge.low{background:var(--warn-soft);color:var(--caramel)}
.badge.expired,.badge.failed,.badge.cancelled,.badge.off,.badge.out{background:var(--rose-soft);color:var(--rose)}
.order{display:grid;grid-template-columns:1.2fr 1.4fr auto;gap:1rem;align-items:start}
@media (max-width:860px){.order{grid-template-columns:1fr}}
.order ul{margin:.2rem 0 0;padding-left:1.1rem}
.order .acts{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:flex-end}
.tbl-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:.55rem .7rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--bg);position:sticky;top:0}
tr.group td{background:var(--bg);font-family:var(--f-display);font-weight:800;font-size:1.05rem}
td.num,th.num{text-align:right}
.adj{display:flex;gap:.35rem;align-items:center;justify-content:flex-end}
.adj input{width:80px;text-align:right}
.adj select{width:auto}
.msg{font-weight:700;font-size:.9rem}
.msg.err{color:var(--rose)}
.msg.ok{color:var(--ok)}
.modal-bg{position:fixed;inset:0;background:rgba(20,10,6,.5);z-index:50;display:grid;place-items:start center;padding:24px 16px;overflow:auto}
.modal{background:var(--bg);border-radius:20px;width:min(980px,100%);padding:1.2rem;display:grid;gap:1rem;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.x{border:0;background:var(--paper);color:var(--fg);width:38px;height:38px;border-radius:50%;font-size:1.3rem;cursor:pointer}
.vt input,.vt select{width:100%;padding:.35rem .5rem;font-size:.9rem}
.vt td{padding:.35rem .4rem}
.vt .w-price{min-width:95px}
.row-actions{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.login{max-width:400px;margin:10vh auto;display:grid;gap:.8rem}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--line)}
.pchk{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.3rem .8rem;max-height:200px;overflow:auto;padding:.5rem;border:1px solid var(--line);border-radius:12px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.7rem 1.1rem;border-radius:999px;font-weight:800;z-index:99}
</style>
</head>
<body>
<header class="top" id="topbar" hidden>
  <div class="wrap">
    <a class="brand" href="./"><img src="img/logo-cireng.jpg" alt="">CamilaNika Admin</a>
    <button type="button" class="badge" id="shop-pill" hidden style="border:0;cursor:pointer" title="Atur buka/tutup toko"></button>
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="orders" aria-pressed="true">Pesanan</button>
      <button type="button" data-tab="shop" aria-pressed="false">Toko</button>
      <button type="button" data-tab="stock" aria-pressed="false">Stok</button>
      <button type="button" data-tab="menu" aria-pressed="false">Menu</button>
      <button type="button" data-tab="products" aria-pressed="false">Produk</button>
      <button type="button" data-tab="promos" aria-pressed="false">Promo</button>
      <button type="button" data-tab="customers" aria-pressed="false">Pelanggan</button>
    </nav>
    <div class="me"><span id="me"></span><button class="btn btn-ghost btn-sm" type="button" id="logout">Keluar</button></div>
  </div>
</header>

<main class="wrap" id="app">
  <p class="muted">Memuat…</p>
</main>

<div class="modal-bg" id="modal" hidden><div class="modal" id="modal-box" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="js/config.js?v=202610262116"></script>
<script src="js/vendor/supabase.js"></script>
<script>
(() => {
  const CFG = window.CN_CONFIG;
  const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  const app = $("app");
  const rp = (n) => n == null ? "–" : "Rp" + Math.round(n).toLocaleString("id-ID");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDate = (d) => d ? new Date(d).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" }) : "";
  const toast = (t) => { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2500); };
  const STATUS = { pending: "Menunggu bayar", paid: "Dibayar", processing: "Diproses", completed: "Selesai", cancelled: "Dibatalkan", expired: "Kedaluwarsa", failed: "Gagal" };
  const ACCENTS = { caramel: ["Karamel", "#B9763A"], rose: ["Pink", "#D9586F"], matcha: ["Matcha", "#6E9A3E"], berry: ["Berry", "#8E4EA8"], ocean: ["Biru", "#2F7FA8"], charcoal: ["Cokelat tua", "#5B4A42"] };
  // main menus + seriess, loaded when needed
  let tree = { cats: [], secs: [] };
  async function loadTree() {
    const [c, s] = await Promise.all([
      sb.from("menu_categories").select("*").order("sort_order").order("id"),
      sb.from("menu_sections").select("*").order("sort_order").order("id"),
    ]);
    if (c.error || s.error) throw c.error || s.error;
    tree = { cats: c.data, secs: s.data };
    return tree;
  }
  const secLabel = (sid) => {
    const s = tree.secs.find((x) => x.id === sid); if (!s) return null;
    const c = tree.cats.find((x) => x.id === s.category_id);
    return `${c ? c.name + " › " : ""}${s.name}`;
  };
  const slugify = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  // accounts made with a WhatsApp number log in with <62number>@phone.camilanika.invalid (see phone-signup function)
  const PHONE_DOMAIN = "phone.camilanika.invalid";
  const loginId = (raw) => {
    raw = String(raw || "").trim(); if (raw.includes("@")) return raw;
    let d = raw.replace(/\D/g, ""); if (d.startsWith("0")) d = "62" + d.slice(1); else if (d.startsWith("8")) d = "62" + d;
    return `${d}@${PHONE_DOMAIN}`;
  };
  const realEmail = (e) => (e && !e.endsWith("@" + PHONE_DOMAIN) ? e : "");
  const err = (e) => (e?.message || String(e)).replace(/^.*?([A-Z_]{5,}.*)$/s, "$1");

  let tab = "orders", refreshTimer = null;

  // ---------------------------------------------------------------- auth gate
  async function gate(session) {
    clearInterval(refreshTimer);
    if (!session) return showLogin();
    const { data: prof } = await sb.from("profiles").select("full_name,role").eq("id", session.user.id).maybeSingle();
    if (prof?.role !== "admin") {
      $("topbar").hidden = true;
      app.innerHTML = `<div class="login card"><h2>Bukan akun admin</h2><p class="muted">${esc(session.user.email)} tidak punya akses admin. Minta pemilik toko menjadikan akun ini admin.</p><button class="btn btn-ghost" id="lo2">Keluar</button></div>`;
      $("lo2").onclick = () => sb.auth.signOut();
      return;
    }
    $("topbar").hidden = false;
    $("me").textContent = prof.full_name || realEmail(session.user.email) || "Admin";
    refreshShopPill(); if (!gate.timer) gate.timer = setInterval(refreshShopPill, 60000);
    $("shop-pill").onclick = () => show("shop");
    show(tab);
  }
  function showLogin() {
    $("topbar").hidden = true;
    app.innerHTML = `<form class="login card" id="lf"><h2>Masuk admin</h2>
      <label class="f">Email atau No. WhatsApp<input id="le" autocomplete="username" required></label>
      <label class="f">Password<input id="lp" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-rose" type="submit">Masuk</button><p class="msg" id="lm"></p></form>`;
    $("lf").onsubmit = async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.signInWithPassword({ email: loginId($("le").value), password: $("lp").value });
      if (error) { $("lm").textContent = "Email atau password salah."; $("lm").className = "msg err"; }
    };
  }
  $("logout").onclick = () => sb.auth.signOut();
  let lastUser;
  sb.auth.onAuthStateChange((ev, s) => {
    const uid = s?.user?.id || null;
    if (ev === "TOKEN_REFRESHED" || (ev === "SIGNED_IN" && uid === lastUser)) return;
    lastUser = uid;
    setTimeout(() => gate(s), 0);
  });

  $("tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) show(b.dataset.tab); });
  function show(t) {
    tab = t; clearInterval(refreshTimer);
    document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.tab === t));
    ({ orders: renderOrders, shop: renderShopTab, stock: renderStock, menu: renderMenuTab, products: renderProducts, promos: renderPromos, customers: renderCustomers })[t]();
  }

  // modal
  const openModal = (html) => { $("modal-box").innerHTML = html; $("modal").hidden = false; };
  const closeModal = () => { $("modal").hidden = true; $("modal-box").innerHTML = ""; };
  $("modal").addEventListener("click", (e) => { if (e.target.id === "modal" || e.target.closest("[data-close]")) closeModal(); });

  // ---------------------------------------------------------------- ORDERS
  let orderFilter = "todo";
  async function renderOrders() {
    app.innerHTML = `<div class="bar"><h2>Pesanan</h2>
      <select id="of"><option value="todo">Perlu diproses (dibayar / diproses)</option><option value="pending">Menunggu pembayaran</option><option value="completed">Selesai</option><option value="closed">Batal / kedaluwarsa / gagal</option><option value="all">Semua</option></select>
      <button class="btn btn-ghost" id="oref">Muat ulang</button></div><div class="list" id="olist"><p class="muted">Memuat…</p></div>`;
    $("of").value = orderFilter;
    $("of").onchange = () => { orderFilter = $("of").value; loadOrders(); };
    $("oref").onclick = loadOrders;
    await loadOrders();
    refreshTimer = setInterval(loadOrders, 30000);
  }
  async function loadOrders() {
    const groups = { todo: ["paid", "processing"], pending: ["pending"], completed: ["completed"], closed: ["cancelled", "expired", "failed"] };
    let q = sb.from("orders").select("*, order_items(*)").order("created_at", { ascending: false }).limit(100);
    if (groups[orderFilter]) q = q.in("status", groups[orderFilter]);
    const { data, error } = await q;
    const el = $("olist"); if (!el) return;
    if (error) { el.innerHTML = `<p class="msg err">${esc(err(error))}</p>`; return; }
    if (!data.length) { el.innerHTML = `<p class="muted">Tidak ada pesanan.</p>`; return; }
    el.innerHTML = data.map((o) => {
      const wa = (o.phone || "").replace(/\D/g, "").replace(/^0/, "62");
      const acts = [];
      if (o.status === "paid") acts.push(`<button class="btn btn-rose btn-sm" data-st="processing" data-id="${o.id}">Proses</button>`);
      if (["paid", "processing"].includes(o.status)) acts.push(`<button class="btn btn-ok btn-sm" data-st="completed" data-id="${o.id}">Selesai</button>`);
      if (["pending", "paid", "processing"].includes(o.status)) acts.push(`<button class="btn btn-ghost btn-sm" data-st="cancelled" data-id="${o.id}" data-paid="${o.status !== "pending"}">Batalkan</button>`);
      return `<div class="card order">
        <div><div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap"><b>${esc(o.order_number)}</b><span class="badge ${o.status}">${STATUS[o.status] || o.status}</span></div>
          <div class="muted" style="font-size:.85rem">${fmtDate(o.created_at)}${o.payment_method ? " · " + esc(o.payment_method) : ""}${o.user_id ? "" : " · tamu"}</div>
          <div style="margin-top:.4rem"><b>${esc(o.customer_name)}</b> · ${wa ? `<a href="https://wa.me/${wa}" target="_blank" rel="noopener">${esc(o.phone)}</a>` : ""}${o.email ? `<br><span class="muted">${esc(o.email)}</span>` : ""}</div>
          ${o.address ? `<div class="muted" style="white-space:pre-line">${esc(o.address)}</div>` : ""}${o.notes ? `<div class="muted">${esc(o.notes)}</div>` : ""}
          ${o.delivery_lat != null ? `<div style="margin-top:.3rem"><a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${o.delivery_lat},${o.delivery_lng}">📍 Buka di Google Maps</a>${o.delivery_km != null ? ` <span class="muted" style="font-size:.85rem">${String(o.delivery_km).replace(".", ",")} km</span>` : ""}</div>` : ""}</div>
        <div><ul>${o.order_items.map((i) => `<li>${i.quantity}× ${esc(i.product_name)} · ${esc(i.variant_name)}${Object.values(i.choices || {}).map((c) => " · " + esc(c)).join("")}${i.addon ? " · <b>" + esc(i.addon) + "</b>" : ""} <span class="muted">${rp(i.line_total)}</span></li>`).join("")}</ul>
          ${(o.gifts || []).map((g) => `<div>🎁 <b>${esc(g.gift)}</b></div>`).join("")}
          <div style="margin-top:.3rem">${o.discount ? `Subtotal ${rp(o.subtotal)} · Diskon −${rp(o.discount)}${o.promo_code ? " (" + esc(o.promo_code) + ")" : ""}<br>` : ""}${o.delivery_fee ? `Ongkir ${rp(o.delivery_fee)}<br>` : ""}<b>Total ${rp(o.total)}</b></div></div>
        <div class="acts">${acts.join("")}</div></div>`;
    }).join("");
    el.querySelectorAll("[data-st]").forEach((b) => b.onclick = async () => {
      if (b.dataset.st === "cancelled" && !confirm(b.dataset.paid === "true"
        ? "Batalkan pesanan yang SUDAH DIBAYAR? Refund dilakukan manual di dashboard Midtrans, dan stok tidak dikembalikan otomatis."
        : "Batalkan pesanan ini? Stok yang dipesan akan dikembalikan.")) return;
      b.disabled = true;
      const { error } = await sb.rpc("admin_set_order_status", { p_order_id: b.dataset.id, p_status: b.dataset.st });
      if (error) { toast(err(error)); b.disabled = false; } else { toast("Status diperbarui"); loadOrders(); }
    });
  }

  // ---------------------------------------------------------------- STOCK
  let lowOnly = false;
  async function renderStock() {
    app.innerHTML = `<div class="bar"><h2>Stok</h2><label class="chk"><input type="checkbox" id="lowonly"> Hanya stok menipis / habis</label><button class="btn btn-ghost" id="sref">Muat ulang</button></div>
      <p class="muted" style="margin:-.4rem 0 1rem">Ketik jumlah yang tersedia lalu <b>Simpan</b>. <b>Kosongkan</b> = habis. <b>Tak terbatas</b> = selalu tersedia tanpa dihitung. Varian baru otomatis tak terbatas.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Varian</th><th>Status</th><th class="num">Tersedia</th><th class="num">Dipesan</th><th class="num">Batas menipis</th><th class="num"></th></tr></thead><tbody id="stbody"><tr><td colspan="6" class="muted">Memuat…</td></tr></tbody></table></div>`;
    $("lowonly").checked = lowOnly;
    $("lowonly").onchange = () => { lowOnly = $("lowonly").checked; loadStock(); };
    $("sref").onclick = loadStock;
    await loadStock();
  }
  async function loadStock() {
    const { data, error } = await sb.from("products")
      .select("id,name,is_active,sort_order,product_variants(id,name,is_active,sort_order,inventory(stock,reserved,low_stock_threshold,unlimited))")
      .order("sort_order").order("id");
    const tb = $("stbody"); if (!tb) return;
    if (error) { tb.innerHTML = `<tr><td colspan="6" class="msg err">${esc(err(error))}</td></tr>`; return; }
    let html = "";
    for (const p of data) {
      const vs = p.product_variants.sort((a, b) => a.sort_order - b.sort_order || a.id - b.id).map((v) => {
        const inv = Array.isArray(v.inventory) ? v.inventory[0] : v.inventory;
        return { ...v, inv: inv || { stock: 0, reserved: 0, low_stock_threshold: 5, unlimited: false } };
      }).filter((v) => !lowOnly || (!v.inv.unlimited && v.inv.stock - v.inv.reserved <= v.inv.low_stock_threshold));
      if (!vs.length) continue;
      html += `<tr class="group"><td colspan="6">${esc(p.name)} ${p.is_active ? "" : '<span class="badge off">nonaktif</span>'}</td></tr>`;
      html += vs.map((v) => {
        const unl = !!v.inv.unlimited, av = v.inv.stock - v.inv.reserved;
        const [cls, label] = unl ? ["on", "Tak terbatas"] : av <= 0 ? ["out", "Habis"] : av <= v.inv.low_stock_threshold ? ["low", "Menipis"] : ["on", "Tersedia"];
        return `<tr><td>${esc(v.name)} ${v.is_active ? "" : '<span class="badge off">nonaktif</span>'}</td>
          <td><span class="badge ${cls}">${label}</span></td>
          <td class="num"><input type="number" min="0" step="1" value="${unl ? "" : av}" placeholder="∞" data-av="${v.id}" aria-label="Jumlah tersedia ${esc(v.name)}" style="width:80px;text-align:right"></td>
          <td class="num">${v.inv.reserved || 0}</td>
          <td class="num">${unl ? '<span class="muted">–</span>' : `<input type="number" min="0" value="${v.inv.low_stock_threshold}" data-th="${v.id}" style="width:70px;text-align:right" aria-label="Batas menipis ${esc(v.name)}">`}</td>
          <td><div class="adj">
            <button class="btn btn-rose btn-sm" data-save="${v.id}">Simpan</button>
            ${!unl && av <= 0 ? "" : `<button class="btn btn-ghost btn-sm" data-empty="${v.id}">Kosongkan</button>`}
            ${unl ? "" : `<button class="btn btn-ok btn-sm" data-unl="${v.id}">Tak terbatas</button>`}
          </div></td></tr>`;
      }).join("");
    }
    tb.innerHTML = html || `<tr><td colspan="6" class="muted">Tidak ada varian${lowOnly ? " yang menipis" : ""}.</td></tr>`;
    const setStock = async (b, id, available, msg) => {
      b.disabled = true;
      const { error } = await sb.rpc("admin_set_stock", { p_variant_id: +id, p_available: available });
      if (error) { toast(err(error)); b.disabled = false; } else { toast(msg); loadStock(); }
    };
    tb.querySelectorAll("[data-save]").forEach((b) => b.onclick = () => {
      const raw = tb.querySelector(`[data-av="${b.dataset.save}"]`).value.trim();
      if (raw === "") return toast("Ketik jumlahnya dulu, atau pakai Tak terbatas");
      const n = parseInt(raw, 10);
      if (!(n >= 0)) return toast("Jumlah harus 0 atau lebih");
      setStock(b, b.dataset.save, n, n === 0 ? "Stok dikosongkan" : `Tersedia ${n}`);
    });
    tb.querySelectorAll("[data-av]").forEach((i) => i.onkeydown = (e) => { if (e.key === "Enter") tb.querySelector(`[data-save="${i.dataset.av}"]`).click(); });
    tb.querySelectorAll("[data-empty]").forEach((b) => b.onclick = () => setStock(b, b.dataset.empty, 0, "Stok dikosongkan"));
    tb.querySelectorAll("[data-unl]").forEach((b) => b.onclick = () => setStock(b, b.dataset.unl, null, "Stok tak terbatas"));
    tb.querySelectorAll("[data-th]").forEach((i) => i.onchange = async () => {
      const { error } = await sb.from("inventory").update({ low_stock_threshold: Math.max(0, +i.value || 0) }).eq("variant_id", +i.dataset.th);
      toast(error ? err(error) : "Batas menipis tersimpan");
    });
  }

  async function loadMenuTab() {

    } catch (e) { el.innerHTML = `<p class="msg err">${esc(err(e))}</p>`; return; }

          <span style="margin-left:auto;display:flex;gap:.35rem;flex-wrap:wrap">

            <button class="btn btn-ghost btn-sm" data-cmove="${c.id}" data-dir="1" ${ci === tree.cats.length - 1 ? "disabled" : ""} aria-label="Turunkan ${esc(c.name)}">↓</button>
            <button class="btn btn-ghost btn-sm" data-cedit="${c.id}">Ubah</button>
            <button class="btn btn-rose btn-sm" data-snew="${c.id}">+ Series</button>
          </span>
        </div>
        ${secs.length ? `<div class="tbl-wrap"><table><thead><tr><th>Series</th><th>Keterangan</th><th class="num">Produk</th><th>Status</th><th></th></tr></thead><tbody>
          ${secs.map((s, si) => `<tr>
            <td><span style="display:inline-flex;gap:.45rem;align-items:center"><i style="width:12px;height:12px;border-radius:50%;background:${ACCENTS[s.accent]?.[1] || "#999"};display:inline-block"></i>${s.icon ? esc(s.icon) + " " : ""}<b>${esc(s.name)}</b></span></td>
            <td class="muted" style="font-size:.88rem">${esc(s.tagline || "")}</td>
            <td class="num">${counts[s.id] || 0}</td>

            <td><div class="adj">

              <button class="btn btn-ghost btn-sm" data-smove="${s.id}" data-dir="1" ${si === secs.length - 1 ? "disabled" : ""} aria-label="Turunkan ${esc(s.name)}">↓</button>
              <button class="btn btn-ghost btn-sm" data-sedit="${s.id}">Ubah</button></div></td></tr>`).join("")}
        </tbody></table></div>` : `<p class="muted" style="margin:0">Belum ada series. Menu utama tanpa series berisi produk tidak tampil di toko.</p>`}

      const s = tree.secs.find((x) => x.id === +b.dataset.smove);
      move("menu_sections", tree.secs.filter((x) => x.category_id === s.category_id), s.id, +b.dataset.dir);

  // swap positions with the neighbour; renumber 10, 20, 30… so the order is always clean
  async function move(table, list, id, dir) {
    const arr = [...list];
    const i = arr.findIndex((x) => x.id === id), j = i + dir;
    if (i < 0 || j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    for (let k = 0; k < arr.length; k++) {
      if (arr[k].sort_order === (k + 1) * 10) continue;
      const { error } = await sb.from(table).update({ sort_order: (k + 1) * 10 }).eq("id", arr[k].id);
      if (error) return toast(err(error));
    }
    loadMenuTab();
  }

  function editCategory(c) {
    const isNew = !c;
    c = c || { name: "", slug: "", eyebrow: "", heading: "", heading_script: "", description: "", is_active: true };

    openModal(`<div class="modal-head"><h2>${isNew ? "Menu utama baru" : "Ubah " + esc(c.name)}</h2><button class="x" data-close aria-label="Tutup">×</button></div>
      <div class="grid2">
        <label class="f">Nama (link di atas halaman)<input id="cn" value="${esc(c.name)}" placeholder="mis. Minuman"></label>
        <label class="f">Slug (alamat #, unik)<input id="cs" value="${esc(c.slug)}" placeholder="minuman"></label>
        <label class="f">Label kecil di atas judul (opsional)<input id="ce" value="${esc(c.eyebrow || "")}" placeholder="mis. Our Menu"></label>
        <label class="f">Judul besar (kosong = pakai nama)<input id="ch" value="${esc(c.heading || "")}" placeholder="mis. Coffee & Drinks"></label>
        <label class="f">Tulisan tangan setelah judul (opsional)<input id="cscr" value="${esc(c.heading_script || "")}" placeholder="mis. dalam botol"></label>
        <label class="chk" style="align-self:end"><input type="checkbox" id="ca" ${c.is_active ? "checked" : ""}> Tampilkan di toko</label>
      </div>
      <label class="f">Deskripsi<textarea id="cd" rows="3">${esc(c.description || "")}</textarea></label>
      <div class="grid2">
        <label class="f">Info singkat di bawah deskripsi (satu per baris)<textarea id="chl" rows="3" placeholder="mis. Simpan di kulkas, tahan hingga 7 hari">${esc((c.highlights || []).join("\n"))}</textarea></label>
        <label class="f">Label bulat (pisahkan koma, opsional)<textarea id="ctg" rows="3" placeholder="mis. Keju Lumer, Jando Pedas">${esc((c.tags || []).join(", "))}</textarea></label>
      </div>
      <div class="card" style="display:grid;gap:.7rem">
        <h3>Foto showcase</h3>
        <div class="grid2">
          <label class="f">Tampilan<select id="cly">
            <option value="none">Tanpa foto</option>
            <option value="row">Deretan foto (geser), di atas menu</option>
            <option value="mosaic">Mosaik foto, di samping menu</option></select></label>
          <label class="f" id="cnw">Tulisan di bawah mosaik (opsional)<input id="cnote" value="${esc(c.showcase_note || "")}" placeholder="mis. Gurih di luar, nagih di dalam!"></label>
        </div>
        <div id="cshots" style="display:grid;gap:.5rem"></div>
        <label class="f">Tambah foto (bisa pilih beberapa, maks 3 MB per foto)<input type="file" id="cfile" accept="image/*" multiple></label>
        <p class="muted" style="margin:0;font-size:.85rem">Mosaik: foto pertama tampil besar. Deretan: foto tegak (3:4) paling bagus.</p>
      </div>
      <p class="msg" id="cmsg"></p>
      <div class="row-actions">${isNew ? "" : '<button class="btn btn-ghost" id="cdel" style="margin-right:auto">Hapus menu utama</button>'}<button class="btn btn-ghost" data-close>Batal</button><button class="btn btn-rose" id="csave">Simpan</button></div>`);
    $("cn").oninput = () => { if (isNew) $("cs").value = slugify($("cn").value); };
    const fail = (m) => { $("cmsg").textContent = m; $("cmsg").className = "msg err"; };
    $("cly").value = c.showcase_layout || "none";
    const readShots = () => $("cshots").querySelectorAll("[data-shot]").forEach((r) => {
      const i = shots[+r.dataset.shot];
      i.url = r.querySelector("[data-u]").value.trim(); i.caption = r.querySelector("[data-c]").value.trim();
      i.tag = r.querySelector("[data-t]").value.trim();
    });
    const drawShots = () => {
      const lay = $("cly").value;
      $("cnw").hidden = lay !== "mosaic";
      $("cshots").innerHTML = shots.map((i, n) => `<div data-shot="${n}" style="display:grid;grid-template-columns:56px minmax(0,2fr) minmax(0,1.4fr) ${lay === "row" ? "70px" : ""} auto;gap:.4rem;align-items:center">
        <img class="thumb" src="${esc(i.url)}" alt="" style="width:56px;height:56px">
        <input data-u value="${esc(i.url)}" aria-label="Alamat foto ${n + 1}">
        <input data-c value="${esc(i.caption || "")}" placeholder="Keterangan" aria-label="Keterangan foto ${n + 1}">
        <input data-t value="${esc(i.tag || "")}" placeholder="mis. L" aria-label="Label kecil foto ${n + 1}" ${lay === "row" ? "" : "hidden"}>
        <span style="display:flex;gap:.25rem"><button class="btn btn-ghost btn-sm" data-up="${n}" ${n ? "" : "disabled"} aria-label="Naikkan">↑</button><button class="btn btn-ghost btn-sm" data-dn="${n}" ${n < shots.length - 1 ? "" : "disabled"} aria-label="Turunkan">↓</button><button class="btn btn-ghost btn-sm" data-rm="${n}" aria-label="Hapus foto">✕</button></span>
      </div>`).join("") || `<p class="muted" style="margin:0">Belum ada foto.</p>`;
      const swap = (a, b) => { readShots(); [shots[a], shots[b]] = [shots[b], shots[a]]; drawShots(); };
      $("cshots").querySelectorAll("[data-up]").forEach((b) => b.onclick = () => swap(+b.dataset.up, +b.dataset.up - 1));
      $("cshots").querySelectorAll("[data-dn]").forEach((b) => b.onclick = () => swap(+b.dataset.dn, +b.dataset.dn + 1));
      $("cshots").querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => { readShots(); shots.splice(+b.dataset.rm, 1); drawShots(); });
      $("cshots").querySelectorAll("[data-u]").forEach((inp) => inp.onchange = () => { inp.parentElement.querySelector("img").src = inp.value; });
    };
    $("cly").onchange = () => { readShots(); drawShots(); };
    drawShots();
    $("cfile").onchange = async () => {
      readShots();
      const files = [...$("cfile").files];
      for (const f of files) {
        if (f.size > 3 * 1024 * 1024) { toast(`${f.name}: maks 3 MB`); continue; }
        const path = `showcase/${Date.now()}-${slugify(f.name.replace(/\.[^.]+$/, ""))}.${(f.name.split(".").pop() || "jpg").toLowerCase()}`;
        toast(`Mengunggah ${f.name}…`);

        if (error) { toast("Gagal unggah: " + error.message); continue; }
        shots.push({ url: sb.storage.from("product-images").getPublicUrl(path).data.publicUrl, caption: "" });
      }
      $("cfile").value = "";
      if ($("cly").value === "none" && shots.length) $("cly").value = "mosaic";
      drawShots(); toast("Foto ditambahkan. Jangan lupa Simpan.");
    };
    $("csave").onclick = async () => {
      const row = { name: $("cn").value.trim(), slug: slugify($("cs").value || $("cn").value), eyebrow: $("ce").value.trim() || null,
        heading: $("ch").value.trim() || null, heading_script: $("cscr").value.trim() || null, description: $("cd").value.trim() || null, is_active: $("ca").checked };
      readShots();
      row.showcase_layout = $("cly").value;
      row.showcase_images = shots.filter((i) => i.url).map((i) => ({ url: i.url, caption: i.caption || undefined, tag: i.tag || undefined, alt: i.alt || i.caption || undefined }));
      row.showcase_note = $("cnote").value.trim() || null;
      row.highlights = $("chl").value.split("\n").map((x) => x.trim()).filter(Boolean);
      row.tags = $("ctg").value.split(",").map((x) => x.trim()).filter(Boolean);
      if (row.showcase_layout !== "none" && !row.showcase_images.length) return fail("Tambahkan foto, atau pilih Tampilan: Tanpa foto.");
      if (!row.name || !row.slug) return fail("Nama wajib diisi.");
      if (isNew) row.sort_order = ((tree.cats.at(-1)?.sort_order) || 0) + 10;
      $("csave").disabled = true;
      const { error } = isNew ? await sb.from("menu_categories").insert(row) : await sb.from("menu_categories").update(row).eq("id", c.id);
      $("csave").disabled = false;
      if (error) return fail(/duplicate key/i.test(error.message) ? "Slug sudah dipakai menu lain." : "Gagal menyimpan: " + error.message);
      closeModal(); toast("Menu utama tersimpan"); loadMenuTab();
    };
    if (!isNew) $("cdel").onclick = async () => {
      const secs = tree.secs.filter((s) => s.category_id === c.id);
      if (!confirm(`Hapus menu utama "${c.name}"?${secs.length ? ` ${secs.length} series di dalamnya ikut terhapus, dan produknya disembunyikan dari toko sampai dipindah ke series lain.` : ""} Produk dan riwayat pesanan tidak dihapus.`)) return;
      const { error } = await sb.from("menu_categories").delete().eq("id", c.id);
      if (error) return fail("Gagal menghapus: " + error.message);
      closeModal(); toast("Menu utama dihapus"); loadMenuTab();
    };
  }

    openModal(`<div class="modal-head"><h2>${isNew ? "Series baru" : "Ubah " + esc(s.name)}</h2><button class="x" data-close aria-label="Tutup">×</button></div>
      <div class="grid2">

  // ---------------------------------------------------------------- PRODUCTS
  let products = [];
  async function renderProducts() {
    app.innerHTML = `<div class="bar"><h2>Produk</h2><button class="btn btn-rose" id="newp">+ Produk baru</button></div>
      <p class="muted" style="margin:-.4rem 0 1rem">Produk dikelompokkan per series. Atur menu utama dan series di tab <b>Menu</b>.</p>
      <div class="tbl-wrap"><table><thead><tr><th></th><th>Nama</th><th>Series</th><th class="num">Varian</th><th class="num">Harga</th><th>Status</th><th class="num">Urutan</th><th></th></tr></thead><tbody id="pbody"><tr><td colspan="8" class="muted">Memuat…</td></tr></tbody></table></div>`;
    $("newp").onclick = () => editProduct(null);
    await loadProducts();
  }
  async function loadProducts() {
    const { data, error } = await sb.from("products").select("*, product_variants(*)").order("sort_order").order("id");
    const tb = $("pbody"); if (!tb) return;
    if (error) { tb.innerHTML = `<tr><td colspan="8" class="msg err">${esc(err(error))}</td></tr>`; return; }
    try { await loadTree(); } catch (e) { tb.innerHTML = `<tr><td colspan="8" class="msg err">${esc(err(e))}</td></tr>`; return; }
    products = data;
    // order: by main menu, then series, then product; products without a series last
    const secOrder = [];
    tree.cats.forEach((c) => tree.secs.filter((s) => s.category_id === c.id).forEach((s) => secOrder.push(s.id)));
    const rank = (p) => { const i = secOrder.indexOf(p.section_id); return i < 0 ? 1e6 : i; };
    const sorted = [...data].sort((a, b) => rank(a) - rank(b) || a.sort_order - b.sort_order || a.id - b.id);
    let lastGroup;
    tb.innerHTML = sorted.map((p) => {
      const label = secLabel(p.section_id);
      const group = label ? `<tr class="group"><td colspan="8">${esc(label)}</td></tr>` : `<tr class="group"><td colspan="8">Belum ada series <span class="badge off">tidak tampil di toko</span></td></tr>`;
      const gh = (label || "-") !== lastGroup ? group : ""; lastGroup = label || "-";
      return gh + rowHTML(p);
    }).join("") || `<tr><td colspan="8" class="muted">Belum ada produk.</td></tr>`;
    tb.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => editProduct(products.find((p) => p.id === +b.dataset.edit)));
  }
  function rowHTML(p) {
    {
      const prices = p.product_variants.filter((v) => v.is_active).map((v) => v.price);
      const range = prices.length ? (Math.min(...prices) === Math.max(...prices) ? rp(prices[0]) : `${rp(Math.min(...prices))} – ${rp(Math.max(...prices))}`) : "–";
      return `<tr><td>${p.image_url ? `<img class="thumb" src="${esc(p.image_url)}" alt="">` : ""}</td><td><b>${esc(p.name)}</b><br><span class="muted" style="font-size:.85rem">${esc(p.subtitle || "")}</span></td>
        <td>${esc(secLabel(p.section_id) || "–")}</td><td class="num">${p.product_variants.length}</td><td class="num">${range}</td>
        <td><span class="badge ${p.is_active ? "on" : "off"}">${p.is_active ? "Aktif" : "Nonaktif"}</span></td><td class="num">${p.sort_order}</td>
        <td><button class="btn btn-ghost btn-sm" data-edit="${p.id}">Ubah</button></td></tr>`;
    }
  }

  function editProduct(p) {
    const isNew = !p;
    p = p ? structuredClone(p) : { name: "", slug: "", section_id: tree.secs[0]?.id ?? null, subtitle: "", note: "", image_url: "", attr_names: ["Ukuran"], choices: [], addon_label: "", is_active: true, sort_order: (products.at(-1)?.sort_order || 0) + 10, product_variants: [] };
    let variants = p.product_variants.sort((a, b) => a.sort_order - b.sort_order || a.id - b.id).map((v) => ({ ...v }));
    let attrs = [...p.attr_names];
    const secOpts = tree.cats.map((c) => `<optgroup label="${esc(c.name)}">${tree.secs.filter((s) => s.category_id === c.id)
      .map((s) => `<option value="${s.id}" ${s.id === p.section_id ? "selected" : ""}>${esc(s.name)}${s.is_active ? "" : " (nonaktif)"}</option>`).join("")}</optgroup>`).join("");

    openModal(`<div class="modal-head"><h2>${isNew ? "Produk baru" : "Ubah " + esc(p.name)}</h2><button class="x" data-close aria-label="Tutup">×</button></div>
      <div class="grid3">
        <label class="f">Nama<input id="pn" value="${esc(p.name)}" required></label>
        <label class="f">Slug (unik, untuk sistem)<input id="ps" value="${esc(p.slug)}"></label>
        <label class="f">Series<select id="psec"><option value="" ${p.section_id ? "" : "selected"}>— Pilih series —</option>${secOpts}</select></label>
        <label class="f">Deskripsi singkat<input id="psub" value="${esc(p.subtitle || "")}"></label>
        <label class="f">Label kecil (opsional)<input id="pnote" value="${esc(p.note || "")}" placeholder="mis. Mengandung kopi"></label>
        <label class="f">Urutan tampil<input id="pso" type="number" value="${p.sort_order}"></label>
      </div>
      <div class="grid2">
        <label class="f">Gambar<span style="display:flex;gap:.5rem;align-items:center">${p.image_url ? `<img class="thumb" id="pimgv" src="${esc(p.image_url)}" alt="">` : `<img class="thumb" id="pimgv" alt="" hidden>`}<input id="pimg" value="${esc(p.image_url || "")}" placeholder="img/menu/xxx.webp atau URL" style="flex:1"></span>
          <input type="file" id="pfile" accept="image/*"></label>
        <div style="display:grid;gap:.5rem;align-content:start">
          <label class="chk"><input type="checkbox" id="pact" ${p.is_active ? "checked" : ""}> Tampilkan di toko</label>
          <label class="f">Tambahan berbayar (opsional)<input id="padd" value="${esc(p.addon_label || "")}" placeholder="mis. Extra shot — harga diisi per varian"></label>
        </div>
      </div>
      <div class="card" style="display:grid;gap:.6rem">
        <h3>Pilihan gratis <span class="muted" style="font-size:.85rem;font-weight:600">(tidak mengubah harga/stok, mis. tingkat gula)</span></h3>
        <div id="chs"></div>
        <div><button class="btn btn-ghost btn-sm" id="addch">+ Pilihan</button></div>
      </div>
      <div class="card" style="display:grid;gap:.6rem">
        <h3>Varian <span class="muted" style="font-size:.85rem;font-weight:600">(tiap varian punya harga & stok sendiri)</span></h3>
        <label class="f">Atribut varian, pisahkan dengan koma<input id="pattrs" value="${esc(attrs.join(", "))}" placeholder="mis. Rasa, Ukuran"></label>
        <p class="muted" style="margin:0;font-size:.85rem">Minuman: pakai atribut <b>Ukuran</b> dengan nilai S / M / L supaya tombol ukuran di toko bekerja.</p>
        <details><summary style="cursor:pointer;font-weight:800">Buat varian otomatis dari kombinasi</summary>
          <div id="gen" style="display:grid;gap:.5rem;margin-top:.5rem"></div></details>
        <div class="tbl-wrap"><table class="vt"><thead id="vth"></thead><tbody id="vtb"></tbody></table></div>
        <div><button class="btn btn-ghost btn-sm" id="addv">+ Varian</button></div>
      </div>
      <p class="msg" id="pmsg"></p>
      <div class="row-actions"><button class="btn btn-ghost" data-close>Batal</button><button class="btn btn-rose" id="psave">Simpan produk</button></div>`);

    const choicesEl = $("chs");
    const drawChoices = () => {
      choicesEl.innerHTML = p.choices.map((c, i) => `<div class="grid3" style="align-items:end" data-ch="${i}">
        <label class="f">Nama pilihan<input data-cl value="${esc(c.label)}"></label>
        <label class="f">Opsi (pisahkan koma)<input data-co value="${esc(c.options.join(", "))}"></label>
        <span style="display:flex;gap:.5rem;align-items:end"><label class="f" style="flex:1">Default (nomor opsi, mulai 1)<input data-cd type="number" min="1" value="${(c.default ?? 0) + 1}"></label><button class="btn btn-ghost btn-sm" data-delch="${i}">Hapus</button></span></div>`).join("") || `<p class="muted" style="margin:0">Tidak ada.</p>`;
      choicesEl.querySelectorAll("[data-delch]").forEach((b) => b.onclick = () => { readChoices(); p.choices.splice(+b.dataset.delch, 1); drawChoices(); });
    };
    const readChoices = () => {
      p.choices = [...choicesEl.querySelectorAll("[data-ch]")].map((r) => {
        const options = r.querySelector("[data-co]").value.split(",").map((s) => s.trim()).filter(Boolean);
        return { label: r.querySelector("[data-cl]").value.trim(), options, default: Math.min(Math.max(+r.querySelector("[data-cd]").value - 1, 0), Math.max(options.length - 1, 0)) };
      }).filter((c) => c.label && c.options.length);
    };
    $("addch").onclick = () => { readChoices(); p.choices.push({ label: "Tingkat gula", options: ["Less Sugar", "Normal Sugar"], default: 1 }); drawChoices(); };
    drawChoices();

    const readVariants = () => {
      $("vtb").querySelectorAll("tr[data-v]").forEach((tr) => {
        const v = variants[+tr.dataset.v];
        v.attrs = {}; attrs.forEach((a) => { const val = tr.querySelector(`[data-a="${CSS.escape(a)}"]`)?.value.trim(); if (val) v.attrs[a] = val; });
        v.name = tr.querySelector("[data-n]").value.trim();
        v.price = parseInt(tr.querySelector("[data-pr]").value, 10);
        const ap = tr.querySelector("[data-ap]").value; v.addon_price = ap === "" ? null : parseInt(ap, 10);
        v.sku = tr.querySelector("[data-sku]").value.trim() || null;
        v.is_active = tr.querySelector("[data-act]").checked;
      });
    };
    const autoName = (v) => attrs.map((a) => v.attrs?.[a]).filter(Boolean).join(" · ");
    const drawVariants = () => {
      $("vth").innerHTML = `<tr>${attrs.map((a) => `<th>${esc(a)}</th>`).join("")}<th>Nama varian</th><th class="num">Harga</th><th class="num">Harga tambahan</th><th>SKU</th><th>Aktif</th><th></th></tr>`;
      $("vtb").innerHTML = variants.map((v, i) => v._del ? "" : `<tr data-v="${i}">
        ${attrs.map((a) => `<td><input data-a="${esc(a)}" value="${esc(v.attrs?.[a] || "")}"></td>`).join("")}
        <td><input data-n value="${esc(v.name || "")}" placeholder="otomatis"></td>
        <td class="w-price"><input data-pr type="number" min="0" step="500" value="${v.price ?? ""}"></td>
        <td class="w-price"><input data-ap type="number" min="0" step="500" value="${v.addon_price ?? ""}" placeholder="—"></td>
        <td><input data-sku value="${esc(v.sku || "")}"></td>
        <td><input data-act type="checkbox" ${v.is_active !== false ? "checked" : ""}></td>
        <td><button class="btn btn-ghost btn-sm" data-delv="${i}" title="${v.id ? "Varian lama sebaiknya dinonaktifkan" : "Hapus"}">Hapus</button></td></tr>`).join("") || `<tr><td colspan="${attrs.length + 6}" class="muted">Belum ada varian.</td></tr>`;
      $("vtb").querySelectorAll("[data-delv]").forEach((b) => b.onclick = () => {
        readVariants();
        const v = variants[+b.dataset.delv];
        if (v.id && !confirm("Hapus varian ini permanen (termasuk stoknya)? Riwayat pesanan tetap tersimpan. Untuk menyembunyikan saja, hilangkan centang Aktif.")) return;
        v._del = true; drawVariants();
      });
      $("gen").innerHTML = attrs.map((a) => `<label class="f">${esc(a)} (pisahkan koma)<input data-g="${esc(a)}" value="${esc([...new Set(variants.filter((v) => !v._del).map((v) => v.attrs?.[a]).filter(Boolean))].join(", "))}"></label>`).join("") +
        `<label class="f">Harga awal untuk varian baru<input id="gprice" type="number" min="0" step="500"></label><div><button class="btn btn-ghost btn-sm" id="gbtn">Tambahkan kombinasi yang belum ada</button></div>`;
      $("gbtn").onclick = () => {
        readVariants();
        const lists = attrs.map((a) => $("gen").querySelector(`[data-g="${CSS.escape(a)}"]`).value.split(",").map((s) => s.trim()).filter(Boolean));
        if (lists.some((l) => !l.length)) return toast("Isi nilai untuk setiap atribut");
        let combos = [{}];
        attrs.forEach((a, i) => { combos = combos.flatMap((c) => lists[i].map((val) => ({ ...c, [a]: val }))); });
        let added = 0;
        combos.forEach((c) => {
          if (variants.some((v) => !v._del && attrs.every((a) => v.attrs?.[a] === c[a]))) return;
          variants.push({ attrs: c, name: "", price: +$("gprice").value || 0, addon_price: null, is_active: true }); added++;
        });
        drawVariants(); toast(`${added} varian ditambahkan`);
      };
    };
    $("addv").onclick = () => { readVariants(); variants.push({ attrs: {}, name: "", price: null, addon_price: null, is_active: true }); drawVariants(); };
    $("pattrs").onchange = () => { readVariants(); attrs = $("pattrs").value.split(",").map((s) => s.trim()).filter(Boolean); drawVariants(); };
    drawVariants();
    $("pn").oninput = () => { if (isNew) $("ps").value = slugify($("pn").value); };
    $("pimg").oninput = () => { const v = $("pimgv"); v.src = $("pimg").value; v.hidden = !$("pimg").value; };
    $("pfile").onchange = async () => {
      const f = $("pfile").files[0]; if (!f) return;
      if (f.size > 3 * 1024 * 1024) return toast("Maks 3 MB");
      const path = `${Date.now()}-${slugify(f.name.replace(/\.[^.]+$/, ""))}.${(f.name.split(".").pop() || "jpg").toLowerCase()}`;
      toast("Mengunggah…");
      const { error } = await sb.storage.from("product-images").upload(path, f, { contentType: f.type, upsert: false });
      if (error) return toast("Gagal unggah: " + error.message);
      $("pimg").value = sb.storage.from("product-images").getPublicUrl(path).data.publicUrl; $("pimg").oninput(); toast("Gambar terunggah");
    };

    $("psave").onclick = async () => {
      readChoices(); readVariants();
      attrs = $("pattrs").value.split(",").map((s) => s.trim()).filter(Boolean);
      const msg = $("pmsg"); const fail = (t) => { msg.textContent = t; msg.className = "msg err"; };
      const live = variants.filter((v) => !v._del);
      const prod = {
        name: $("pn").value.trim(), slug: slugify($("ps").value || $("pn").value), section_id: $("psec").value ? +$("psec").value : null,
        subtitle: $("psub").value.trim() || null, note: $("pnote").value.trim() || null, image_url: $("pimg").value.trim() || null,
        attr_names: attrs, choices: p.choices, addon_label: $("padd").value.trim() || null,
        is_active: $("pact").checked, sort_order: parseInt($("pso").value, 10) || 0,
      };
      if (!prod.name || !prod.slug) return fail("Nama produk wajib diisi.");
      if (!prod.section_id) return fail("Pilih series supaya produk tampil di toko.");
      if (!live.length) return fail("Tambahkan minimal satu varian.");
      for (const v of live) {
        if (!Number.isInteger(v.price) || v.price < 0) return fail("Setiap varian harus punya harga.");
        if (attrs.some((a) => !v.attrs[a])) return fail("Isi semua atribut di setiap varian.");
        if (!v.name) v.name = autoName(v) || "Default";
      }
      const keys = live.map((v) => JSON.stringify(attrs.map((a) => v.attrs[a])));
      if (new Set(keys).size !== keys.length) return fail("Ada varian dengan kombinasi atribut yang sama.");

      $("psave").disabled = true; msg.textContent = "Menyimpan…"; msg.className = "msg";
      try {
        let pid = p.id;
        if (isNew) {
          const { data, error } = await sb.from("products").insert(prod).select("id").single(); if (error) throw error; pid = data.id;
        } else {
          const { error } = await sb.from("products").update(prod).eq("id", pid); if (error) throw error;
        }
        const del = variants.filter((v) => v._del && v.id).map((v) => v.id);
        if (del.length) { const { error } = await sb.from("product_variants").delete().in("id", del); if (error) throw error; }
        let so = 0;
        for (const v of live) {
          const row = { product_id: pid, name: v.name, attrs: v.attrs, price: v.price, addon_price: v.addon_price, sku: v.sku || null, is_active: v.is_active, sort_order: ++so };
          const { error } = v.id ? await sb.from("product_variants").update(row).eq("id", v.id) : await sb.from("product_variants").insert(row);
          if (error) throw error;
        }
        closeModal(); toast("Produk tersimpan"); loadProducts();
      } catch (e) {
        fail(/duplicate key.*slug/i.test(e.message) ? "Slug sudah dipakai produk lain." : /duplicate key.*sku/i.test(e.message) ? "SKU sudah dipakai varian lain." : "Gagal menyimpan: " + e.message);
      } finally { const b = $("psave"); if (b) b.disabled = false; }
    };
  }

  // ---------------------------------------------------------------- CUSTOMERS (accounts)
  let custSearch = "";
  async function renderCustomers() {
    app.innerHTML = `<div class="bar"><h2>Pelanggan</h2>
      <input id="cq" type="search" placeholder="Cari nama, email, atau no. WA" style="min-width:min(100%,280px)" aria-label="Cari pelanggan">
      <button class="btn btn-ghost" id="cref">Muat ulang</button></div>
      <p class="muted" style="margin:-.4rem 0 1rem">Akun yang mendaftar di toko. Pesanan tamu (tanpa akun) ada di tab Pesanan.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Pelanggan</th><th>Kontak</th><th class="num">Pesanan</th><th class="num">Total belanja</th><th>Terakhir pesan</th><th>Peran</th><th></th></tr></thead>
      <tbody id="cbody"><tr><td colspan="7" class="muted">Memuat…</td></tr></tbody></table></div>`;
    $("cq").value = custSearch;
    let t; $("cq").oninput = () => { clearTimeout(t); t = setTimeout(() => { custSearch = $("cq").value.trim(); loadCustomers(); }, 300); };
    $("cref").onclick = loadCustomers;
    await loadCustomers();
  }
  async function loadCustomers() {
    const tb = $("cbody"); if (!tb) return;
    const { data, error } = await sb.rpc("admin_list_customers", { p_search: custSearch || null });
    if (error) { tb.innerHTML = `<tr><td colspan="7" class="msg err">${esc(err(error))}</td></tr>`; return; }
    const me = (await sb.auth.getUser()).data.user?.id;
    tb.innerHTML = data.map((c) => {
      const wa = (c.phone || "").replace(/\D/g, "").replace(/^0/, "62");
      return `<tr>
        <td><b>${esc(c.full_name || "(tanpa nama)")}</b>${c.id === me ? ' <span class="muted">(kamu)</span>' : ""}<br>
          <span class="muted" style="font-size:.82rem">Daftar ${fmtDate(c.created_at)}${c.confirmed ? "" : ' · <span class="badge pending">email belum dikonfirmasi</span>'}</span></td>
        <td>${realEmail(c.email) ? esc(c.email) + "<br>" : '<span class="muted" style="font-size:.82rem">Daftar pakai No. WA</span><br>'}${wa ? `<a href="https://wa.me/${wa}" target="_blank" rel="noopener">${esc(c.phone)}</a>` : ""}</td>
        <td class="num">${c.paid_count}${c.orders_count > c.paid_count ? ` <span class="muted">/ ${c.orders_count}</span>` : ""}</td>
        <td class="num">${rp(c.total_spent)}</td>
        <td>${c.last_order_at ? fmtDate(c.last_order_at) : '<span class="muted">–</span>'}</td>
        <td><span class="badge ${c.role === "admin" ? "processing" : ""}">${c.role === "admin" ? "Admin" : "Pelanggan"}</span></td>
        <td><div class="adj">
          ${c.orders_count ? `<button class="btn btn-ghost btn-sm" data-corders="${c.id}">Pesanan</button>` : ""}
          <button class="btn btn-ghost btn-sm" data-reset="${c.id}">Reset password</button>
          ${c.id === me || c.role === "admin" ? "" : `<button class="btn btn-ghost btn-sm" data-del="${c.id}" style="color:var(--rose)">Hapus akun</button>`}
          ${c.id === me ? "" : `<button class="btn btn-ghost btn-sm" data-role="${c.id}" data-to="${c.role === "admin" ? "customer" : "admin"}" data-name="${esc(c.full_name || c.email)}">${c.role === "admin" ? "Cabut admin" : "Jadikan admin"}</button>`}
        </div></td></tr>`;
    }).join("") || `<tr><td colspan="7" class="muted">${custSearch ? "Tidak ada yang cocok." : "Belum ada pelanggan terdaftar."}</td></tr>`;
    tb.querySelectorAll("[data-role]").forEach((b) => b.onclick = async () => {
      const toAdmin = b.dataset.to === "admin";
      if (!confirm(toAdmin
        ? `Jadikan ${b.dataset.name} admin? Admin bisa melihat semua pesanan dan data pelanggan, serta mengubah menu, stok dan promo.`
        : `Cabut akses admin ${b.dataset.name}?`)) return;
      b.disabled = true;
      const { error } = await sb.rpc("admin_set_role", { p_user_id: b.dataset.role, p_role: b.dataset.to });
      if (error) { toast(err(error)); b.disabled = false; } else { toast(toAdmin ? "Sekarang admin" : "Akses admin dicabut"); loadCustomers(); }
    });
    tb.querySelectorAll("[data-corders]").forEach((b) => b.onclick = () => customerOrders(data.find((c) => c.id === b.dataset.corders)));
    tb.querySelectorAll("[data-reset]").forEach((b) => b.onclick = () => resetPassword(data.find((c) => c.id === b.dataset.reset)));
    tb.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => deleteAccount(data.find((c) => c.id === b.dataset.del)));
  }
  // calls the admin-users Edge Function with the admin's login
  async function adminUsers(body) {
    const { data: s } = await sb.auth.getSession();
    const res = await fetch(`${CFG.SUPABASE_URL}/functions/v1/admin-users`, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: CFG.SUPABASE_ANON_KEY, Authorization: `Bearer ${CFG.SUPABASE_ANON_KEY}`, "x-user-token": s?.session?.access_token || "" },
      body: JSON.stringify(body),
    });
    const out = await res.json().catch(() => ({ error: "FAILED" }));
    return res.ok && !out.error ? { ok: true } : { error: out.error || "FAILED" };
  }

  function deleteAccount(c) {
    const who = c.full_name || c.phone || realEmail(c.email) || "akun ini";
    openModal(`<div class="modal-head"><h2>Hapus akun</h2><button class="x" data-close aria-label="Tutup">×</button></div>
      <p style="margin:0">Hapus akun <b>${esc(who)}</b>${c.phone ? ` (${esc(c.phone)})` : ""}? Orang ini tidak bisa masuk lagi, dan profilnya (nama, alamat) dihapus.</p>
      <p class="muted" style="margin:0">${c.orders_count ? `${c.orders_count} pesanannya tetap tersimpan di tab Pesanan, tapi tidak lagi terhubung ke akun.` : "Akun ini belum punya pesanan."} Tidak bisa dibatalkan. Nomor/email yang sama bisa mendaftar lagi nanti.</p>
      <label class="f">Ketik <b>HAPUS</b> untuk konfirmasi<input id="delc" autocomplete="off"></label>
      <p class="msg" id="delm"></p>
      <div class="row-actions"><button class="btn btn-ghost" data-close>Batal</button><button class="btn btn-rose" id="delgo" disabled>Hapus akun</button></div>`);
    $("delc").oninput = () => { $("delgo").disabled = $("delc").value.trim().toUpperCase() !== "HAPUS"; };
    $("delgo").onclick = async () => {
      $("delgo").disabled = true;
      const r = await adminUsers({ action: "delete_user", user_id: c.id });
      if (r.error) {
        $("delm").className = "msg err";
        $("delm").textContent = { REMOVE_ADMIN_FIRST: "Cabut akses admin dulu sebelum menghapus.", CANNOT_DELETE_SELF: "Kamu tidak bisa menghapus akunmu sendiri.", NOT_ADMIN: "Hanya admin yang bisa menghapus akun." }[r.error] || "Gagal menghapus. Coba lagi.";
        $("delgo").disabled = false; return;
      }
      closeModal(); toast("Akun dihapus"); loadCustomers();
    };
  }

  function resetPassword(c) {
    const words = "kopi,latte,aren,cireng,keju,mocha,matcha,gula,susu,botol".split(",");
    const pick = () => words[crypto.getRandomValues(new Uint32Array(1))[0] % words.length];
    const temp = `${pick()}-${pick()}-${String(crypto.getRandomValues(new Uint32Array(1))[0] % 9000 + 1000)}`;
    const wa = (c.phone || "").replace(/\D/g, "").replace(/^0/, "62");
    openModal(`<div class="modal-head"><h2>Reset password</h2><button class="x" data-close aria-label="Tutup">×</button></div>
      <p style="margin:0">Buat password baru untuk <b>${esc(c.full_name || c.phone || c.email)}</b>. Password lama langsung tidak berlaku.</p>
      <label class="f">Password baru (minimal 8 karakter)<input id="rp1" value="${esc(temp)}" autocomplete="off"></label>
      <p class="msg" id="rpm"></p>
      <div class="row-actions"><button class="btn btn-ghost" data-close>Batal</button><button class="btn btn-rose" id="rpsave">Simpan password baru</button></div>`);
    $("rpsave").onclick = async () => {
      const pw = $("rp1").value.trim();
      if (pw.length < 8) { $("rpm").textContent = "Minimal 8 karakter."; $("rpm").className = "msg err"; return; }
      $("rpsave").disabled = true;
      const out = await adminUsers({ action: "reset_password", user_id: c.id, password: pw });
      $("rpsave").disabled = false;
      if (out.error) { $("rpm").textContent = out.error === "NOT_ADMIN" ? "Hanya admin yang bisa reset password." : "Gagal menyimpan. Coba lagi."; $("rpm").className = "msg err"; return; }
      const msg = `Halo ${c.full_name || ""}, password akun CamilaNika kamu sudah kami ganti. Password baru: ${pw}\nMasuk di camilanika.github.io pakai nomor WhatsApp ini, lalu ganti password lewat menu Akun kalau mau.`;
      $("modal-box").innerHTML = `<div class="modal-head"><h2>Password diganti</h2><button class="x" data-close aria-label="Tutup">×</button></div>
        <p style="margin:0">Password baru: <code style="font-size:1.05rem;user-select:all">${esc(pw)}</code></p>
        <div class="row-actions">${wa ? `<a class="btn btn-ok" href="https://wa.me/${wa}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Kirim lewat WhatsApp</a>` : ""}<button class="btn btn-ghost" data-close>Selesai</button></div>`;
    };
  }
  async function customerOrders(c) {
    openModal(`<div class="modal-head"><h2>Pesanan ${esc(c.full_name || c.email)}</h2><button class="x" data-close aria-label="Tutup">×</button></div><div class="list" id="colist"><p class="muted">Memuat…</p></div>`);
    const { data, error } = await sb.from("orders").select("order_number,status,total,discount,created_at,order_items(product_name,variant_name,quantity)").eq("user_id", c.id).order("created_at", { ascending: false }).limit(50);
    const el = $("colist"); if (!el) return;
    if (error) { el.innerHTML = `<p class="msg err">${esc(err(error))}</p>`; return; }
    el.innerHTML = data.map((o) => `<div class="card"><div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap"><b>${esc(o.order_number)}</b><span class="badge ${o.status}">${STATUS[o.status] || o.status}</span><span class="muted" style="margin-left:auto;font-size:.85rem">${fmtDate(o.created_at)}</span></div>
      <div class="muted" style="font-size:.9rem">${o.order_items.map((i) => `${i.quantity}× ${esc(i.product_name)} · ${esc(i.variant_name)}`).join("<br>")}</div><b>${rp(o.total)}</b></div>`).join("") || `<p class="muted">Belum ada pesanan.</p>`;
  }

  // ---------------------------------------------------------------- SHOP (open / closed / hours)
  async function refreshShopPill() {
    const { data } = await sb.rpc("shop_status");
    const el = $("shop-pill"); if (!el || !data) return data;
    el.hidden = false;
    el.className = "badge " + (data.open ? "on" : "off");
    el.textContent = data.open ? "Toko buka" : "Toko tutup";
    return data;
  }
  async function renderShopTab() {
    app.innerHTML = `<div class="bar"><h2>Toko</h2></div><div id="shopbox" class="list"><p class="muted">Memuat…</p></div>`;
    const [{ data: st }, { data: cfg, error }] = await Promise.all([
      sb.rpc("shop_status"),
      sb.from("shop_settings").select("*").eq("id", 1).maybeSingle(),
    ]);
    const box = $("shopbox"); if (!box) return;
    if (error || !cfg) { box.innerHTML = `<p class="msg err">${esc(err(error || "Pengaturan toko belum ada. Jalankan migration 007."))}</p>`; return; }
    refreshShopPill();
    const statusText = st?.open
      ? (cfg.schedule_enabled ? `Buka sekarang. Tutup otomatis pukul ${st.close_time} WIB.` : "Buka sekarang, tanpa jadwal (buka terus).")
      : cfg.is_closed ? "Tutup sampai kamu buka lagi." : `Tutup sesuai jadwal. Buka lagi pukul ${st.open_time} WIB.`;
    box.innerHTML = `
      <div class="card" style="display:grid;gap:.8rem">
        <div style="display:flex;flex-wrap:wrap;gap:.8rem;align-items:center">
          <span class="badge ${st?.open ? "on" : "off"}" style="font-size:1rem;padding:.35rem .9rem">${st?.open ? "BUKA" : "TUTUP"}</span>
          <span style="font-weight:700">${esc(statusText)}</span>
          <span class="muted" style="margin-left:auto;font-size:.85rem">Sekarang ${esc(st?.now || "")} WIB</span>
        </div>
        <div class="row-actions" style="justify-content:flex-start">
          ${cfg.is_closed
            ? `<button class="btn btn-ok" id="sh-open">Buka toko</button>`
            : `<button class="btn btn-rose" id="sh-close">Tutup toko (sampai dibuka lagi)</button>`}
        </div>
        <p class="muted" style="margin:0;font-size:.88rem">Saat tutup, pembeli tetap bisa melihat menu, tapi tidak bisa menambah ke keranjang, bayar, atau kirim pesanan lewat WhatsApp.</p>
      </div>
      <div class="card" style="display:grid;gap:.8rem">
        <h3>Jadwal buka (WIB, GMT+7)</h3>
        <label class="chk"><input type="checkbox" id="sh-sched" ${cfg.schedule_enabled ? "checked" : ""}> Buka & tutup otomatis setiap hari</label>
        <div class="grid3">
          <label class="f">Jam buka<input type="time" id="sh-ot" value="${esc(String(cfg.open_time).slice(0, 5))}"></label>
          <label class="f">Jam tutup<input type="time" id="sh-ct" value="${esc(String(cfg.close_time).slice(0, 5))}"></label>
        </div>
        <p class="muted" style="margin:0;font-size:.85rem">Jam tutup lebih awal dari jam buka berarti buka sampai lewat tengah malam (mis. 17:00–02:00). Tombol <b>Tutup toko</b> di atas tetap berlaku di luar jadwal.</p>
        <label class="f">Pesan untuk pembeli saat tutup (opsional)<input id="sh-msg" value="${esc(cfg.closed_message || "")}" placeholder="mis. Lagi libur Lebaran, buka lagi 15 April ya!"></label>
        <div><button class="btn btn-rose" id="sh-save">Simpan jadwal</button></div>
        <p class="msg" id="sh-m"></p>
      </div>
      <div class="card" style="display:grid;gap:.8rem">
        <h3>Pengiriman & ongkir</h3>
        <p class="muted" style="margin:0;font-size:.88rem">Pembeli memilih lokasi di peta saat checkout. Jarak dihitung garis lurus dari pin toko. Ongkir di bawah ini kamu isi sendiri, misalnya dari cek tarif di aplikasi Paxel untuk beberapa jarak.</p>
        <label class="f">Lokasi toko (geser pin)<span class="muted" id="dl-orig" style="font-weight:600"></span></label>
        <div id="dl-map" style="height:280px;border-radius:12px;background:var(--line)"></div>
        <label class="chk"><input type="checkbox" id="dl-on" ${cfg.delivery_fee_enabled ? "checked" : ""}> Hitung ongkir otomatis (wajib pilih lokasi saat bayar online)</label>
        <div class="grid3">
          <label class="f">Gratis ongkir sampai (km)<input type="number" min="0" step="0.5" id="dl-free" value="${cfg.free_radius_km ?? 2}"></label>
          <label class="f">Maks jarak antar (km)<input type="number" min="0" step="0.5" id="dl-max" value="${cfg.max_radius_km ?? 25}"></label>
        </div>
        <div><b style="font-size:.9rem">Tarif per jarak</b>
          <div class="tbl-wrap" style="margin-top:.4rem"><table><thead><tr><th>Sampai (km)</th><th>Ongkir (Rp)</th><th></th></tr></thead><tbody id="dl-tiers"></tbody></table></div>
          <button class="btn btn-ghost btn-sm" id="dl-add" style="margin-top:.4rem">+ Baris</button></div>
        <div><button class="btn btn-rose" id="dl-save">Simpan pengiriman</button></div>
        <p class="msg" id="dl-m"></p>
      </div>`;
    const save = async (patch, msg) => {
      const { error } = await sb.from("shop_settings").update(patch).eq("id", 1);
      if (error) { toast(err(error)); return; }
      toast(msg); renderShopTab();
    };
    $("sh-open")?.addEventListener("click", () => save({ is_closed: false }, "Toko dibuka"));
    $("sh-close")?.addEventListener("click", () => {
      if (!confirm("Tutup toko sekarang? Pembeli tidak bisa memesan sampai kamu menekan Buka toko.")) return;
      save({ is_closed: true }, "Toko ditutup");
    });
    $("sh-save").onclick = () => {
      const ot = $("sh-ot").value, ct = $("sh-ct").value;
      if ($("sh-sched").checked && (!ot || !ct)) { $("sh-m").textContent = "Isi jam buka dan jam tutup."; $("sh-m").className = "msg err"; return; }
      save({ schedule_enabled: $("sh-sched").checked, open_time: ot || "08:00", close_time: ct || "21:00", closed_message: $("sh-msg").value.trim() || null }, "Jadwal tersimpan");
    };

    // delivery: tiers editor + origin pin
    let tiers = (Array.isArray(cfg.fee_tiers) ? cfg.fee_tiers : []).map((t) => ({ ...t }));
    let origin = { lat: cfg.origin_lat, lng: cfg.origin_lng };
    const showOrig = () => { $("dl-orig").textContent = ` ${origin.lat.toFixed(5)}, ${origin.lng.toFixed(5)}`; };
    showOrig();
    const readTiers = () => $("dl-tiers").querySelectorAll("tr[data-t]").forEach((r) => {
      tiers[+r.dataset.t] = { up_to_km: parseFloat(r.querySelector("[data-km]").value), fee: parseInt(r.querySelector("[data-fee]").value, 10) };
    });
    const drawTiers = () => {
      $("dl-tiers").innerHTML = tiers.map((t, i) => `<tr data-t="${i}">
        <td><input data-km type="number" min="0" step="0.5" value="${t.up_to_km ?? ""}" style="width:110px" aria-label="Sampai km baris ${i + 1}"></td>
        <td><input data-fee type="number" min="0" step="500" value="${t.fee ?? ""}" style="width:130px" aria-label="Ongkir baris ${i + 1}"></td>
        <td><button class="btn btn-ghost btn-sm" data-rmt="${i}" aria-label="Hapus baris">✕</button></td></tr>`).join("") || `<tr><td colspan="3" class="muted">Belum ada tarif. Tambah baris, mis. sampai 5 km = Rp10.000.</td></tr>`;
      $("dl-tiers").querySelectorAll("[data-rmt]").forEach((b) => b.onclick = () => { readTiers(); tiers.splice(+b.dataset.rmt, 1); drawTiers(); });
    };
    drawTiers();
    $("dl-add").onclick = () => { readTiers(); const last = tiers.at(-1); tiers.push({ up_to_km: last ? (last.up_to_km || 0) + 5 : 5, fee: "" }); drawTiers(); };
    $("dl-save").onclick = async () => {
      readTiers();
      const clean = tiers.filter((t) => Number.isFinite(t.up_to_km) && Number.isFinite(t.fee)).sort((a, b) => a.up_to_km - b.up_to_km);
      const fail = (m) => { $("dl-m").textContent = m; $("dl-m").className = "msg err"; };
      if (clean.length !== tiers.length) return fail("Isi km dan ongkir di setiap baris (atau hapus barisnya).");
      const free = parseFloat($("dl-free").value) || 0, max = parseFloat($("dl-max").value) || 0;
      if ($("dl-on").checked && max <= free && !clean.length) return fail("Isi tarif, atau naikkan Maks jarak antar.");
      save({ delivery_fee_enabled: $("dl-on").checked, free_radius_km: free, max_radius_km: max, fee_tiers: clean, origin_lat: origin.lat, origin_lng: origin.lng }, "Pengaturan pengiriman tersimpan");
    };
    // map for the shop's location (OpenStreetMap, free)
    loadLeaflet().then(() => {
      if (!$("dl-map")) return;
      const m = L.map("dl-map").setView([origin.lat, origin.lng], 15);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(m);
      const pinO = L.marker([origin.lat, origin.lng], { draggable: true }).addTo(m);
      const set = (ll) => { origin = { lat: Math.round(ll.lat * 1e6) / 1e6, lng: Math.round(ll.lng * 1e6) / 1e6 }; showOrig(); };
      pinO.on("dragend", () => set(pinO.getLatLng()));
      m.on("click", (e) => { pinO.setLatLng(e.latlng); set(e.latlng); });
    }).catch(() => { $("dl-map").textContent = "Peta gagal dimuat."; });
  }
  let leafletP = null;
  function loadLeaflet() {
    if (window.L) return Promise.resolve();
    if (leafletP) return leafletP;
    leafletP = new Promise((res, rej) => {
      const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
      const js = document.createElement("script"); js.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; js.onload = res; js.onerror = () => { leafletP = null; rej(); };
      document.head.appendChild(js);
    });
    return leafletP;
  }

  // ---------------------------------------------------------------- PROMOS
  async function renderPromos() {
    app.innerHTML = `<div class="bar"><h2>Promo</h2><button class="btn btn-rose" id="newpr">+ Promo baru</button></div>
      <p class="muted" style="margin:-.4rem 0 1rem">Promo tanpa kode berlaku otomatis (diskon terbesar yang dipakai; semua hadiah gratis yang memenuhi syarat diberikan). Promo dengan kode harus diketik pembeli.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Nama</th><th>Kode</th><th>Jenis</th><th class="num">Min. belanja</th><th>Periode</th><th class="num">Dipakai</th><th>Status</th><th></th></tr></thead><tbody id="prbody"><tr><td colspan="8" class="muted">Memuat…</td></tr></tbody></table></div>`;
    $("newpr").onclick = () => editPromo(null);
    await loadPromos();
  }
  let promos = [];
  async function loadPromos() {
    const { data, error } = await sb.from("promotions").select("*, promotion_products(product_id)").order("created_at", { ascending: false });
    const tb = $("prbody"); if (!tb) return;
    if (error) { tb.innerHTML = `<tr><td colspan="8" class="msg err">${esc(err(error))}</td></tr>`; return; }
    promos = data;
    const now = Date.now();
    tb.innerHTML = data.map((p) => {
      const live = p.is_active && (!p.starts_at || new Date(p.starts_at) <= now) && (!p.ends_at || new Date(p.ends_at) > now) && (!p.usage_limit || p.used_count < p.usage_limit);
      const kind = p.discount_type === "percent" ? `${p.value}%${p.max_discount ? " (maks " + rp(p.max_discount) + ")" : ""}` : p.discount_type === "fixed" ? rp(p.value) : "🎁 " + esc(p.gift_text);
      const period = p.starts_at || p.ends_at ? `${p.starts_at ? fmtDate(p.starts_at) : "…"} – ${p.ends_at ? fmtDate(p.ends_at) : "…"}` : "Selalu";
      return `<tr><td><b>${esc(p.name)}</b>${p.applies_to_all ? "" : '<br><span class="muted" style="font-size:.8rem">produk tertentu</span>'}</td><td>${p.code ? `<code>${esc(p.code)}</code>` : '<span class="muted">otomatis</span>'}</td>
        <td>${kind}</td><td class="num">${p.min_spend ? rp(p.min_spend) : "–"}</td><td style="font-size:.85rem">${period}</td><td class="num">${p.used_count}${p.usage_limit ? " / " + p.usage_limit : ""}</td>
        <td><span class="badge ${live ? "on" : "off"}">${live ? "Berjalan" : p.is_active ? "Tidak berjalan" : "Nonaktif"}</span></td>
        <td><button class="btn btn-ghost btn-sm" data-edit="${p.id}">Ubah</button></td></tr>`;
    }).join("") || `<tr><td colspan="8" class="muted">Belum ada promo.</td></tr>`;
    tb.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => editPromo(promos.find((x) => x.id === +b.dataset.edit)));
  }

  async function editPromo(p) {
    const isNew = !p;
    p = p || { name: "", description: "", code: "", discount_type: "percent", value: 10, gift_text: "", min_spend: 0, max_discount: null, applies_to_all: true, starts_at: null, ends_at: null, usage_limit: null, is_active: true, promotion_products: [] };
    if (!products.length) { const { data } = await sb.from("products").select("id,name").order("sort_order"); products = data || []; }
    const sel = new Set(p.promotion_products.map((x) => x.product_id));
    const dt = (d) => d ? new Date(new Date(d).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : "";
    openModal(`<div class="modal-head"><h2>${isNew ? "Promo baru" : "Ubah promo"}</h2><button class="x" data-close aria-label="Tutup">×</button></div>
      <div class="grid2">
        <label class="f">Nama promo<input id="qn" value="${esc(p.name)}" placeholder="mis. Diskon Gajian"></label>
        <label class="f">Kode (kosongkan = otomatis)<input id="qc" value="${esc(p.code || "")}" placeholder="mis. GAJIAN10" style="text-transform:uppercase"></label>
      </div>
      <label class="f">Keterangan untuk pembeli (tampil di banner / keranjang)<textarea id="qd" rows="2">${esc(p.description || "")}</textarea></label>
      <div class="grid3">
        <label class="f">Jenis<select id="qt"><option value="percent">Diskon persen</option><option value="fixed">Potongan Rupiah</option><option value="free_item">Hadiah gratis</option></select></label>
        <label class="f" id="qvw">Nilai<input id="qv" type="number" min="0" value="${p.value}"></label>
        <label class="f" id="qmw">Maks. diskon (opsional)<input id="qm" type="number" min="0" value="${p.max_discount ?? ""}"></label>
        <label class="f" id="qgw">Hadiah<input id="qg" value="${esc(p.gift_text || "")}" placeholder="mis. Free latte 150 ml"></label>
        <label class="f">Minimal belanja (Rp)<input id="qmin" type="number" min="0" step="1000" value="${p.min_spend}"></label>
        <label class="f">Batas pemakaian (opsional)<input id="ql" type="number" min="1" value="${p.usage_limit ?? ""}"></label>
        <label class="f">Mulai (opsional)<input id="qs" type="datetime-local" value="${dt(p.starts_at)}"></label>
        <label class="f">Berakhir (opsional)<input id="qe" type="datetime-local" value="${dt(p.ends_at)}"></label>
        <label class="chk" style="align-self:end"><input type="checkbox" id="qa" ${p.is_active ? "checked" : ""}> Aktif</label>
      </div>
      <label class="chk"><input type="checkbox" id="qall" ${p.applies_to_all ? "checked" : ""}> Berlaku untuk semua produk</label>
      <div class="pchk" id="qprods" ${p.applies_to_all ? "hidden" : ""}>${products.map((x) => `<label class="chk"><input type="checkbox" value="${x.id}" ${sel.has(x.id) ? "checked" : ""}> ${esc(x.name)}</label>`).join("")}</div>
      <p class="muted" style="margin:0;font-size:.85rem">Minimal belanja dihitung dari produk yang ikut promo.</p>
      <p class="msg" id="qmsg"></p>
      <div class="row-actions">${isNew ? "" : '<button class="btn btn-ghost" id="qdel" style="margin-right:auto">Hapus promo</button>'}<button class="btn btn-ghost" data-close>Batal</button><button class="btn btn-rose" id="qsave">Simpan promo</button></div>`);
    $("qt").value = p.discount_type;
    const sync = () => { const t = $("qt").value; $("qvw").hidden = t === "free_item"; $("qmw").hidden = t !== "percent"; $("qgw").hidden = t !== "free_item"; $("qvw").firstChild.textContent = t === "percent" ? "Diskon (%)" : "Potongan (Rp)"; };
    $("qt").onchange = sync; sync();
    $("qall").onchange = () => { $("qprods").hidden = $("qall").checked; };
    if (!isNew) $("qdel").onclick = async () => {
      if (p.used_count && !confirm("Promo ini sudah pernah dipakai. Lebih aman dinonaktifkan saja. Tetap hapus?")) return;
      if (!p.used_count && !confirm("Hapus promo ini?")) return;
      const { error } = await sb.from("promotions").delete().eq("id", p.id);
      if (error) return toast(/foreign key/i.test(error.message) ? "Promo sudah dipakai di pesanan — nonaktifkan saja." : err(error));
      closeModal(); toast("Promo dihapus"); loadPromos();
    };
    $("qsave").onclick = async () => {
      const t = $("qt").value, num = (id) => $(id).value === "" ? null : parseInt($(id).value, 10);
      const row = {
        name: $("qn").value.trim(), description: $("qd").value.trim() || null, code: $("qc").value.trim().toUpperCase() || null,
        discount_type: t, value: t === "free_item" ? 0 : num("qv") || 0, gift_text: t === "free_item" ? $("qg").value.trim() : null,
        max_discount: t === "percent" ? num("qm") : null, min_spend: num("qmin") || 0, usage_limit: num("ql"),
        starts_at: $("qs").value ? new Date($("qs").value).toISOString() : null, ends_at: $("qe").value ? new Date($("qe").value).toISOString() : null,
        is_active: $("qa").checked, applies_to_all: $("qall").checked,
      };
      const fail = (m) => { $("qmsg").textContent = m; $("qmsg").className = "msg err"; };
      if (!row.name) return fail("Nama promo wajib diisi.");
      if (t === "percent" && !(row.value >= 1 && row.value <= 100)) return fail("Diskon persen harus 1–100.");
      if (t === "fixed" && !(row.value > 0)) return fail("Isi nilai potongan.");
      if (t === "free_item" && !row.gift_text) return fail("Isi nama hadiahnya.");
      if (row.starts_at && row.ends_at && row.ends_at <= row.starts_at) return fail("Tanggal berakhir harus setelah tanggal mulai.");
      const picked = [...$("qprods").querySelectorAll("input:checked")].map((i) => +i.value);
      if (!row.applies_to_all && !picked.length) return fail("Pilih minimal satu produk.");
      $("qsave").disabled = true;
      try {
        let id = p.id;
        if (isNew) { const { data, error } = await sb.from("promotions").insert(row).select("id").single(); if (error) throw error; id = data.id; }
        else { const { error } = await sb.from("promotions").update(row).eq("id", id); if (error) throw error; }
        { const { error } = await sb.from("promotion_products").delete().eq("promotion_id", id); if (error) throw error; }
        if (!row.applies_to_all) { const { error } = await sb.from("promotion_products").insert(picked.map((pid) => ({ promotion_id: id, product_id: pid }))); if (error) throw error; }
        closeModal(); toast("Promo tersimpan"); loadPromos();
      } catch (e) {
        fail(/duplicate key.*code/i.test(e.message) ? "Kode promo sudah dipakai." : "Gagal menyimpan: " + e.message);
      } finally { const b = $("qsave"); if (b) b.disabled = false; }
    };
  }
})();
</script>
</body>
