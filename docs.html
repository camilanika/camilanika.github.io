<!doctype html>
<html lang="en">
<head>
<title>CamilaNika API Reference</title>
<meta charset="utf-8">
<!-- QA fix OBS-31: GitHub Pages can't send X-Frame-Options / frame-ancestors, so the page hides itself inside a frame (OWASP clickjacking defence) -->
<style id="anti-clickjack">html{display:none !important}</style>
<script>if (self === top) document.getElementById("anti-clickjack").remove(); else top.location = self.location;</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky left index of groups + one long reference column; endpoints rendered as compact rows with param tables. */
:root{
  --bg:#ffffff; --panel:#f7f4f1; --line:#e7e0d9; --fg:#2a211c; --muted:#76675d;
  --accent:#a8652c; --accent-soft:#f6e9dc; --code-bg:#f3efeb;
  --get:#2f7fa8; --post:#6e9a3e; --patch:#b9763a; --del:#c2455d;
  --pub:#2f7fa8; --cust:#8e4ea8; --admin:#c2455d;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181412; --panel:#211c19; --line:#3a312b; --fg:#f0e8e2; --muted:#a8998e;
  --accent:#e0a36a; --accent-soft:#3a2a1d; --code-bg:#251f1b;
  --get:#6cb6dc; --post:#9ccc6c; --patch:#e0a36a; --del:#ec7f93;
  --pub:#6cb6dc; --cust:#c191d6; --admin:#ec7f93; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181412; --panel:#211c19; --line:#3a312b; --fg:#f0e8e2; --muted:#a8998e;
  --accent:#e0a36a; --accent-soft:#3a2a1d; --code-bg:#251f1b;
  --get:#6cb6dc; --post:#9ccc6c; --patch:#e0a36a; --del:#ec7f93;
  --pub:#6cb6dc; --cust:#c191d6; --admin:#ec7f93; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body)}
a{color:var(--accent)}
code,pre,.mono{font-family:var(--f-mono);font-size:.86em}
code{background:var(--code-bg);padding:.1em .35em;border-radius:4px}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;max-width:1180px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 80px}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;max-height:calc(100vh - 40px);overflow:auto;display:flex;flex-direction:column;gap:14px}
nav .brand{font:700 1.15rem/1.2 var(--f-display)}
nav .brand span{color:var(--accent)}
nav input{width:100%;box-sizing:border-box;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:.9rem}
nav input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
nav li a{display:flex;justify-content:space-between;gap:8px;padding:.3rem .5rem;border-radius:6px;color:var(--fg);text-decoration:none;font-size:.9rem}
nav li a:hover,nav li a:focus-visible{background:var(--panel);outline:none}
nav li a small{color:var(--muted);font-variant-numeric:tabular-nums}
nav .navlbl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
main{min-width:0;display:flex;flex-direction:column;gap:48px}
h1{font:700 clamp(2rem,4vw,2.8rem)/1.1 var(--f-display);margin:0;text-wrap:balance}
h2{font:700 1.55rem/1.2 var(--f-display);margin:0 0 6px;text-wrap:balance}
h3{font:600 1rem/1.3 var(--f-body);margin:0}
.lede{color:var(--muted);max-width:66ch;margin:10px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:.2rem .6rem;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.note{background:var(--accent-soft);border-radius:10px;padding:14px 16px;max-width:76ch;font-size:.92rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.box{border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.box p{margin:6px 0 0;color:var(--muted);font-size:.9rem}
pre{background:var(--code-bg);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:0;line-height:1.55;position:relative}
.codewrap{position:relative}
.copy{position:absolute;top:8px;right:8px;font:500 .72rem var(--f-body);padding:.25rem .55rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}
.copy:hover{color:var(--fg)}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td code{white-space:nowrap}
.group-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:2px solid var(--fg);padding-bottom:8px;margin-bottom:4px}
.group-head p{margin:0;color:var(--muted);font-size:.9rem}
.ep{border-bottom:1px solid var(--line);padding:16px 0;display:flex;flex-direction:column;gap:8px;scroll-margin-top:20px}
.ep-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.verb{font:600 .7rem/1 var(--f-mono);letter-spacing:.04em;padding:.32rem .45rem;border-radius:5px;color:var(--bg);min-width:3.6em;text-align:center}
.v-GET{background:var(--get)}.v-POST{background:var(--post)}.v-PATCH{background:var(--patch)}.v-DELETE{background:var(--del)}.v-STORAGE{background:var(--muted)}
.path{font:500 .92rem var(--f-mono);word-break:break-all}
.auth{font-size:.7rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:.15rem .5rem;border-radius:999px;border:1px solid currentColor}
.a-public{color:var(--pub)}.a-customer{color:var(--cust)}.a-admin{color:var(--admin)}
.ep .desc{margin:0;color:var(--muted);font-size:.92rem;max-width:80ch}
.ep pre{font-size:.82rem}
.ep table{font-size:.84rem}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--muted)}
.empty{color:var(--muted);padding:20px 0}
code.sig{display:inline-block;white-space:nowrap;font-size:.8rem;color:var(--fg)}
mark{background:var(--accent-soft);color:inherit}
@media (max-width:820px){.wrap{grid-template-columns:1fr;gap:24px}nav{position:static;max-height:none}nav ul{flex-direction:row;flex-wrap:wrap}nav .navlbl{width:100%}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}

.gate{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate-card{max-width:380px;text-align:center;display:flex;flex-direction:column;gap:12px}
.gate-card h1{font-size:1.6rem}
.gate-card p{color:var(--muted);margin:0}
.gate-card a.btn{display:inline-block;padding:.6rem 1rem;border-radius:8px;background:var(--accent);color:var(--bg);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="gate-card">
  <h1>CamilaNika API</h1>
  <p id="gate-msg">Checking your admin login…</p>
  <p id="gate-act" hidden><a class="btn" href="admin.html">Log in to Admin</a></p>
</div></div>
<div id="docs-root"></div>
<script src="js/config.js"></script>
<script src="js/vendor/supabase.js"></script>
<script>
(async () => {
  const gate = document.getElementById("gate");
  const msg = document.getElementById("gate-msg");
  const act = document.getElementById("gate-act");
  const deny = (t) => { msg.textContent = t; act.hidden = false; };
  try {
    const CFG = window.CN_CONFIG;
    const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    const { data: s } = await sb.auth.getSession();
    if (!s?.session) return deny("Log in to the admin panel first, then reopen this page.");
    const { data: ok, error } = await sb.rpc("is_admin");
    if (error || ok !== true) return deny("This page is for admins only.");
    // The reference itself is not in this page (QA fix OBS-9): api/docs.php sends it only after
    // Supabase confirms, with this admin's own session token, that the caller is an admin.
    const res = await fetch("api/docs.php", { headers: { "X-User-Token": s.session.access_token }, cache: "no-store" });
    if (res.status === 401 || res.status === 403) return deny("This page is for admins only. Log in to the admin panel again, then reopen this page.");
    if (!res.ok) throw new Error("docs " + res.status);
    const d = await res.json();
    gate.remove();
    document.getElementById("docs-root").innerHTML = d.html;
    renderDocs(d);
  } catch (e) {
    deny("Couldn't check your login. Refresh the page to try again.");
  }
})();
function renderDocs(d) {
// endpoint groups, enums and pg_proc signatures come from api/docs.php (admins only)
const ENUMS=d.enums, G=d.groups, SIG=d.sig;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const total=G.reduce((n,g)=>n+g.eps.length,0);
const rpcN=G.flatMap(g=>g.eps).filter(e=>e[1].startsWith("rpc/")).length;
document.getElementById("stats").innerHTML=[`${total} endpoints`,`${rpcN} RPC functions`,`3 Edge Functions`,`2 storage buckets`,`Supabase`].map(s=>`<span class="chip">${s}</span>`).join("");
document.getElementById("enum-body").innerHTML=ENUMS.map(e=>`<tr><td>${esc(e[0])}</td><td><code style="white-space:normal">${esc(e[1])}</code></td><td>${esc(e[2])}</td></tr>`).join("");

function epHTML(e,gid,i){
  const [verb,path,auth,title,desc,params,body]=e;
  const label=verb==="STORAGE"?"FILE":verb;
  let h=`<article class="ep" id="${gid}-${i}" data-s="${esc((path+" "+title+" "+desc+" "+(params||[]).map(p=>p[0]).join(" ")).toLowerCase())}">
  <div class="ep-top"><span class="verb v-${verb}">${label}</span><span class="path">/${esc(path)}</span><span class="auth a-${auth}">${auth}</span></div>
  <h3>${esc(title)}</h3>`;
  if(desc) h+=`<p class="desc">${esc(desc)}</p>`;
  const fn=path.startsWith("rpc/")&&SIG[path.slice(4)];
  if(fn) h+=`<div class="tblw"><code class="sig">${esc(path.slice(4))}(${esc(fn[0])}) → ${esc(fn[1])}</code></div>`;
  if(params&&params.length) h+=`<div class="tblw"><table><thead><tr><th>Field</th><th>Type</th><th>Notes</th></tr></thead><tbody>${params.map(p=>`<tr><td><code>${esc(p[0])}</code></td><td>${esc(p[1])}</td><td>${esc(p[2])}</td></tr>`).join("")}</tbody></table></div>`;
  if(body) h+=`<div class="codewrap"><button class="copy" type="button">Copy</button><pre>${esc(body)}</pre></div>`;
  return h+`</article>`;
}
document.getElementById("groups").innerHTML=G.map(g=>`<section class="group" id="${g.id}" style="margin-bottom:40px">
  <div class="group-head"><h2>${esc(g.name)}</h2><p>${esc(g.blurb)}</p></div>
  ${g.eps.map((e,i)=>epHTML(e,g.id,i)).join("")}</section>`).join("");
const toc=document.getElementById("toc");
function drawToc(){toc.innerHTML=G.map(g=>{const n=document.querySelectorAll(`#${g.id} .ep:not([hidden])`).length;return `<li${n?"":" hidden"}><a href="#${g.id}">${esc(g.name.replace("Admin · ",""))}<small>${n}</small></a></li>`}).join("")}
drawToc();

const q=document.getElementById("q");
q.addEventListener("input",()=>{
  const v=q.value.trim().toLowerCase();let shown=0;
  document.querySelectorAll(".group").forEach(sec=>{let n=0;
    sec.querySelectorAll(".ep").forEach(ep=>{const ok=!v||ep.dataset.s.includes(v);ep.hidden=!ok;if(ok)n++;});
    sec.hidden=!n;shown+=n;});
  document.getElementById("empty").hidden=!!shown;drawToc();
});

document.addEventListener("click",ev=>{
  const b=ev.target.closest(".copy");if(!b)return;
  const pre=b.parentElement.querySelector("pre");const txt=pre.textContent;
  const done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1400)};
  try{navigator.clipboard.writeText(txt).then(done,()=>sel(pre))}catch(e){sel(pre)}
  function sel(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Press Ctrl+C"}
});

}
</script>
</body>
</html>
