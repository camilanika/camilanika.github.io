  <main>
    <header id="overview">
      <h1>CamilaNika API Reference</h1>
      <p class="lede">Every backend call made by the storefront (<code>index.html</code> → <code>js/shop.js</code>) and the admin panel (<code>admin.html</code>, <code>js/cashflow.js</code>). The backend is a Supabase project: PostgREST tables, Postgres RPC functions, three Edge Functions and two Storage buckets.</p>
      <div class="meta" id="stats"></div>
    </header>

    <section class="note">
      <b>How this was built.</b> Documented on 8 Nov 2026 from the shipped front-end code and checked against the live database schema. Signatures, return types and enum values come from Postgres (<code>pg_proc</code> and check constraints). Every RPC is <code>SECURITY DEFINER</code>; admin RPCs are executable by any signed-in user and check the admin role inside the function. Internal helper functions (triggers, loyalty, voucher logging and similar) can't be called through the API and are left out.
    </section>
    <section class="note">
      <b>Note.</b> Promotions use <code>free_item</code> as a discount type, while vouchers, tiers and campaigns use <code>shipping</code>.
    </section>

    <section>
      <h2>Base URLs</h2>
      <div class="tblw"><table>
        <thead><tr><th>Surface</th><th>URL</th><th>Client call</th></tr></thead>
        <tbody>
          <tr><td>Tables (PostgREST)</td><td><code>https://&lt;project-ref&gt;.supabase.co/rest/v1/&lt;table&gt;</code></td><td><code>sb.from("table")</code></td></tr>
          <tr><td>RPC functions</td><td><code>https://&lt;project-ref&gt;.supabase.co/rest/v1/rpc/&lt;fn&gt;</code></td><td><code>sb.rpc("fn", args)</code></td></tr>
          <tr><td>Edge Functions</td><td><code>https://&lt;project-ref&gt;.supabase.co/functions/v1/&lt;name&gt;</code></td><td><code>fetch(…)</code></td></tr>
          <tr><td>Storage</td><td><code>https://&lt;project-ref&gt;.supabase.co/storage/v1/object/…</code></td><td><code>sb.storage.from("bucket")</code></td></tr>
        </tbody>
      </table></div>
      <p class="lede">The project URL and anon key come from <code>js/config.js</code> (<code>SUPABASE_URL</code>, <code>SUPABASE_ANON_KEY</code>). Other config keys: <code>ONLINE_PAYMENT</code>, <code>WHATSAPP</code>, <code>SITE_URL</code>.</p>
    </section>

    <section id="auth">
      <h2>Authentication</h2>
      <div class="grid2">
        <div class="box"><span class="auth a-public">Public</span><p>Anon key only. Send <code>apikey</code> and <code>Authorization: Bearer &lt;anon key&gt;</code>.</p></div>
        <div class="box"><span class="auth a-customer">Customer</span><p>Signed-in shopper. <code>Authorization: Bearer &lt;user access_token&gt;</code>. Row-level security scopes data to the user.</p></div>
        <div class="box"><span class="auth a-admin">Admin</span><p>Signed-in user whose <code>profiles.role</code> is <code>admin</code>. Same headers as Customer; the RPCs and policies check the role.</p></div>
      </div>
      <p class="lede">Login is phone-based. <code>phone-signup</code> returns a synthetic <code>login</code> email, which the client passes to <code>auth.signInWithPassword({ email, password })</code>. Edge Functions are called with the anon key as Bearer and the user's JWT in a separate <code>x-user-token</code> header.</p>
      <div class="codewrap"><button class="copy" type="button">Copy</button><pre>curl -X POST "https://&lt;project-ref&gt;.supabase.co/rest/v1/rpc/admin_set_order_status" \
  -H "apikey: $ANON_KEY" \
  -H "Authorization: Bearer $USER_ACCESS_TOKEN" \
  -H "Content-Type: application/json" \
  -d '{"p_order_id": "&lt;order-id&gt;", "p_status": "processing"}'</pre></div>
    </section>

    <section id="enums">
      <h2>Enums &amp; values</h2>
      <div class="tblw"><table>
        <thead><tr><th>Name</th><th>Values</th><th>Used by</th></tr></thead>
        <tbody id="enum-body"></tbody>
      </table></div>
    </section>

      <span><span class="verb v-GET">GET</span> read</span>
      <span><span class="verb v-POST">POST</span> RPC / insert / function</span>
      <span><span class="verb v-PATCH">PATCH</span> update</span>
      <span><span class="verb v-DELETE">DELETE</span> delete</span>
      <span><span class="verb v-STORAGE">FILE</span> storage</span>
    </div>

    <div id="groups"></div>
    <p class="empty" id="empty" hidden>No endpoints match that filter.</p>
  </main>
</div>

<script>
(async () => {
  const gate = document.getElementById("gate");
  const msg = document.getElementById("gate-msg");
  const act = document.getElementById("gate-act");
  const deny = (t) => { msg.textContent = t; act.hidden = false; };
  try {
    const CFG = window.CN_CONFIG;
    const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    const { data: s } = await sb.auth.getSession();
    if (!s?.session) return deny("Log in to the admin panel first, then reopen this page.");
    const { data: ok, error } = await sb.rpc("is_admin");
    if (error || ok !== true) return deny("This page is for admins only.");
    gate.remove();
    document.body.appendChild(document.getElementById("docs-tpl").content.cloneNode(true));
    renderDocs();
  } catch (e) {
    deny("Couldn't check your login. Refresh the page to try again.");
  }
})();

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const rpcN=G.flatMap(g=>g.eps).filter(e=>e[1].startsWith("rpc/")).length;

function epHTML(e,gid,i){
  const [verb,path,auth,title,desc,params,body]=e;
  const label=verb==="STORAGE"?"FILE":verb;
  let h=`<article class="ep" id="${gid}-${i}" data-s="${esc((path+" "+title+" "+desc+" "+(params||[]).map(p=>p[0]).join(" ")).toLowerCase())}">
  <div class="ep-top"><span class="verb v-${verb}">${label}</span><span class="path">/${esc(path)}</span><span class="auth a-${auth}">${auth}</span></div>
  <h3>${esc(title)}</h3>`;
  if(desc) h+=`<p class="desc">${esc(desc)}</p>`;
  const fn=path.startsWith("rpc/")&&SIG[path.slice(4)];
  if(fn) h+=`<div class="tblw"><code class="sig">${esc(path.slice(4))}(${esc(fn[0])}) → ${esc(fn[1])}</code></div>`;
  if(params&&params.length) h+=`<div class="tblw"><table><thead><tr><th>Field</th><th>Type</th><th>Notes</th></tr></thead><tbody>${params.map(p=>`<tr><td><code>${esc(p[0])}</code></td><td>${esc(p[1])}</td><td>${esc(p[2])}</td></tr>`).join("")}</tbody></table></div>`;
  if(body) h+=`<div class="codewrap"><button class="copy" type="button">Copy</button><pre>${esc(body)}</pre></div>`;
  return h+`</article>`;
}
document.getElementById("groups").innerHTML=G.map(g=>`<section class="group" id="${g.id}" style="margin-bottom:40px">
  <div class="group-head"><h2>${esc(g.name)}</h2><p>${esc(g.blurb)}</p></div>
  ${g.eps.map((e,i)=>epHTML(e,g.id,i)).join("")}</section>`).join("");
const toc=document.getElementById("toc");
function drawToc(){toc.innerHTML=G.map(g=>{const n=document.querySelectorAll(`#${g.id} .ep:not([hidden])`).length;return `<li${n?"":" hidden"}><a href="#${g.id}">${esc(g.name.replace("Admin · ",""))}<small>${n}</small></a></li>`}).join("")}
drawToc();

const q=document.getElementById("q");
q.addEventListener("input",()=>{
  const v=q.value.trim().toLowerCase();let shown=0;
  document.querySelectorAll(".group").forEach(sec=>{let n=0;
    sec.querySelectorAll(".ep").forEach(ep=>{const ok=!v||ep.dataset.s.includes(v);ep.hidden=!ok;if(ok)n++;});
    sec.hidden=!n;shown+=n;});
  document.getElementById("empty").hidden=!!shown;drawToc();
});

document.addEventListener("click",ev=>{
  const b=ev.target.closest(".copy");if(!b)return;
  const pre=b.parentElement.querySelector("pre");const txt=pre.textContent;
  const done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1400)};
  try{navigator.clipboard.writeText(txt).then(done,()=>sel(pre))}catch(e){sel(pre)}
  function sel(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Press Ctrl+C"}
});

}
